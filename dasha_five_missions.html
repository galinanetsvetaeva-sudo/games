function returnCountdown(now=new Date()){
 const parts=new Intl.DateTimeFormat('en',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
 const v=Object.fromEntries(parts.filter(p=>p.type!=='literal').map(p=>[p.type,+p.value]));
 const days=Math.round((Date.UTC(2026,10,3)-Date.UTC(v.year,v.month-1,v.day))/86400000);
 if(days>0)return `До урока 3 ноября — ${days} ${days%10===1&&days%100!==11?'день':days%10>=2&&days%10<=4&&!(days%100>=12&&days%100<=14)?'дня':'дней'}`;
 return days===0?'Сегодня 3 ноября — день нашего урока! Что расскажешь Галине?':'Календарь перелистнули, а миссии остаются — можно играть снова.';
}

if(state.revision!==4){if(state.revision!==3){if(state.revision===2){delete state.answers['1-4']}else{Object.keys(state.answers).filter(k=>k.startsWith('1-')).forEach(k=>delete state.answers[k])}}Object.keys(state.answers).filter(k=>k.startsWith('5-')).forEach(k=>delete state.answers[k]);state.revision=4;}

lain?`<p class="clue">${esc(t.explain)}</p>`:''}${r.solved&&t.result?`<div class="clue">${lang(t.result,'result')}${languageButtons(t.result,'result')}</div>`:''}<div class="row">${btn(active===2&&step===4?'Проверить владельца':'Проверить','check',r.solved?'disabled':'','primary')}${r.solved?btn('Повторить задание','replay','','ghost'):''}</div><div class="nav">${btn('← Назад','prev',step===0?'disabled':'','ghost')}${btn(r.solved?(step===4?'К устному продолжению →':'Дальше →'):'Пропустить →','next','','ghost')}</div></section>${reference()}`}
function render(){progressHeader();let html='';if(view==='map')html=renderMap();else{html=`<div class="toolbar">${btn('← Карта миссий','map','','ghost')}<span class="muted">Можно вернуться в любой момент</span></div>`;if(view==='intro')html+=intro();else if(step===5)html+=`<section class="panel celebrate"><div class="symbol">${score(active)===5?'🏅':missions[active].icon}</div><h2>${score(active)===5?'Значок твой!':'Можно продолжить позже'}</h2><p>Выполнено ${score(active)} из 5 заданий.</p>${score(active)<5?btn('К незавершённому заданию','unfinished','','primary'):''}</section>${oralPanel()}<div class="row">${btn('← К заданиям','step','data-step="0"','ghost')}${btn('На карту →','map','','primary')}</div>`;else html+=taskView()}$('app').innerHTML=html;progressHeader()}
function resetTransient(){feedback='';openHints=new Set();interview=null;audioUnavailable=false;if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function goStep(n){step=Math.max(0,Math.min(5,n));view='task';resetTransient();render();window.scrollTo({top:0,behavior:'auto'})}
function valid(t,d){if(t.type==='counts')return t.keys.every(k=>(d[k]||0)===(t.target[k]||0));if(t.type==='choice')return d.choice===t.answer;if(t.type==='multi')return (d.multi||[]).length===t.answer.length&&t.answer.every(x=>(d.multi||[]).includes(x));if(t.type==='pair'||t.type==='outfit')return Object.entries(t.target).every(([k,v])=>d[k]===v);if(t.type==='tokens')return [t.answer,...(t.variants||[])].some(a=>JSON.stringify((d.tokens||[]).map(i=>t.tokens[i]))===JSON.stringify(a));return false}
function hasAnswer(t,d){if(t.type==='counts')return t.keys.some(k=>(d[k]||0)>0);if(t.type==='choice')return d.choice!=null;if(t.type==='multi')return (d.multi||[]).length>0;if(t.type==='pair'||t.type==='outfit')return Object.keys(t.target).every(k=>d[k]!=null);if(t.type==='tokens')return (d.tokens||[]).length>0;return false}
function wrongMessage(t,d){if(active===2&&step===4){const p=people[+d.choice];if(p){if(p.notes!==2)return 'У этого персонажа одна тетрадь, а в найденном рюкзаке две.';if(p.nc!=='蓝色')return 'У этого персонажа красные тетради. В найденном рюкзаке они синие.';if(p.pencil!=='红色')return 'У этого персонажа зелёный карандаш. В найденном рюкзаке — красный.';if(!p.ruler)return 'У этого персонажа нет линейки, а в найденном рюкзаке она есть.';if(p.fruit!=='苹果')return 'У этого персонажа банан. В найденном рюкзаке — яблоко.'}}if(t.type==='multi')return 'Нужны ровно два персонажа. Сравни и количество тетрадей, и их цвет.';if(t.type==='tokens')return 'Пока не получается нужный вопрос. Посмотри на ответ и попробуй поменять порядок блоков.';return t.hint||'Есть несовпадение. Посмотри на подсказки или послушай ещё раз и попробуй снова.'}
function initVoices(){voices='speechSynthesis'in window?window.speechSynthesis.getVoices().filter(v=>/^zh[-_]/i.test(v.lang)):[];const sel=$('voice');sel.innerHTML=voices.length?voices.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option value="">Китайский голос устройства</option>';if(voices.some(v=>v.voiceURI===state.voice))sel.value=state.voice;else if(voices.length){const cn=voices.find(v=>/^zh[-_]CN$/i.test(v.lang));sel.value=(cn||voices[0]).voiceURI} $('speed').value=String(state.speed)}
function soundFailure(){audioUnavailable=true;$('sound-message').textContent='Не удалось запустить китайскую озвучку. Проверь звук и доступные голоса в настройках устройства. Для этого задания можно открыть китайский текст.';if(view==='task'&&step<5)render()}
let currentUtterance=null;
function speak(z,slow=false){if(!z)return;if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined'){soundFailure();return}try{window.speechSynthesis.cancel();const u=currentUtterance=new SpeechSynthesisUtterance(z.cn);u.lang='zh-CN';u.rate=slow?.6:Number($('speed').value||.8);const available=window.speechSynthesis.getVoices();const chosen=available.find(v=>v.voiceURI===$('voice').value)||available.find(v=>/^zh[-_]CN$/i.test(v.lang));if(chosen)u.voice=chosen;u.onerror=e=>{if(currentUtterance===u&&!['interrupted','canceled'].includes(e.error))soundFailure()};u.onstart=()=>{audioUnavailable=false;$('sound-message').textContent='Звучит китайская речь.';if($('reply-sound'))$('reply-sound').textContent='🔊 Персонаж отвечает…'};u.onend=()=>{if(currentUtterance!==u)return;$('sound-message').textContent='Можно слушать ещё раз.';if($('reply-sound'))$('reply-sound').textContent='Ответ прозвучал. Можно послушать ещё раз.'};window.speechSynthesis.speak(u);if(window.speechSynthesis.paused)window.speechSynthesis.resume()}catch(e){soundFailure()}}
function action(a,b){if(a==='postcard'){postcardIndex=(postcardIndex+1)%postcards.length;render();return}if(a==='open'){active=+b.dataset.m;if(!missions[active])return;step=0;view='intro';resetTransient();interviewSeen=new Set();render();window.scrollTo({top:0});return}if(a==='map'){resetTransient();view='map';render();window.scrollTo({top:0});return}if(a==='start'){goStep(0);return}if(a==='step'){goStep(+b.dataset.step);return}if(a==='next'){goStep(step+1);return}if(a==='prev'){goStep(step-1);return}if(a==='unfinished'){goStep(missions[active].tasks.findIndex((_,i)=>!solved(active,i)));return}if(a==='copyReport'){const text=resultText();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>{$('copy-status').textContent='Скопировано — можно отправить маме.'}).catch(()=>{$('result-text').select();$('copy-status').textContent='Выделено: скопируй текст вручную.'});else{$('result-text').select();$('copy-status').textContent='Выделено: скопируй текст вручную.'}return}if(a==='hint'){const k=b.dataset.key;if(active>=0&&step<5&&!openHints.has(k)){record().usedHint=true;save()}openHints.has(k)?openHints.delete(k):openHints.add(k);render();return}if(a==='speak'||a==='slow'){speak(getZ(b.dataset.key),a==='slow');return}if(a==='testVoice'){speak(Z('你好！我们一起开始吧。','',''));return}if(a==='reset'){const d=$('reset-dialog');if(d.showModal)d.showModal();else if(window.confirm('Удалить все отметки и начать сначала?'))action('confirmReset',b);return}if(a==='cancelReset'){ $('reset-dialog').close();return}if(a==='confirmReset'){state.answers={};state.oral={};save();const d=$('reset-dialog');if(d.open)d.close();view='map';resetTransient();render();return}if(a==='oral'){state.oral[active]=true;save();render();return}if(a==='interview'){interview={p:+b.dataset.p,q:+b.dataset.q};interviewSeen.add(interview.p+'-'+interview.q);['qpy','qru','replypy','replyru'].forEach(k=>openHints.delete(k));render();speak(reply(people[interview.p],interview.q));return}const t=missions[active]?.tasks[step];if(!t)return;const r=record(),d=r.draft;if(a==='optionHint'){if(t.hideOptionTranslation&&b.dataset.kind==='ru')return;record().usedHint=true;save();const keys=t.options.map((_,i)=>'opt'+i+b.dataset.kind),show=!keys.every(k=>openHints.has(k));keys.forEach(k=>show?openHints.add(k):openHints.delete(k));render();return}if(a==='replay'){r.solved=false;r.draft={};r.attempts=0;save();resetTransient();render();return}if(r.solved)return;feedback='';if(a==='count'){const k=b.dataset.item;if(t.keys?.includes(k))d[k]=Math.max(0,Math.min(6,(d[k]||0)+Number(b.dataset.delta)))}else if(a==='choose'){if(t.type==='multi'){d.multi=d.multi||[];d.multi=d.multi.includes(b.dataset.value)?d.multi.filter(x=>x!==b.dataset.value):[...d.multi,b.dataset.value]}else d.choice=b.dataset.value}else if(a==='pairPick'){d[b.dataset.field]=b.dataset.value}else if(a==='token'){const i=+b.dataset.index;d.tokens=d.tokens||[];if(!d.tokens.includes(i)&&t.tokens[i]!=null)d.tokens.push(i)}else if(a==='removeToken'){d.tokens.splice(+b.dataset.pos,1)}else if(a==='check'){if(!hasAnswer(t,d)){feedback='Сначала выбери ответ или добавь предметы.'}else{r.attempts=(r.attempts||0)+1;if(valid(t,d)){r.solved=true;feedback=''}else feedback=wrongMessage(t,d)}}save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)action(b.dataset.action,b)});
$('voice').addEventListener('change',()=>{state.voice=$('voice').value;save()});$('speed').addEventListener('change',()=>{state.speed=Number($('speed').value);save()});
if('speechSynthesis'in window)window.speechSynthesis.addEventListener('voiceschanged',initVoices);initVoices();render();
</script></body></html>
