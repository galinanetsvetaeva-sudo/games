intro:{audio:'大家好！我叫小安。我今年十二岁。我的生日是四月十二日。我喜欢星期六。我喜欢蓝色。',lines:[['大家好！我叫小安。','Dàjiā hǎo! Wǒ jiào Xiǎo Ān.'],['我今年十二岁。','Wǒ jīnnián shí’èr suì.'],['我的生日是四月十二日。','Wǒ de shēngrì shì sì yuè shí’èr rì.'],['我喜欢星期六。','Wǒ xǐhuan xīngqīliù.'],['我喜欢蓝色。','Wǒ xǐhuan lánsè.']]},
family:{audio:'我家有四口人。爸爸、妈妈、妹妹和我。我家有一只狗。它叫毛毛。早上，妈妈说：请吃早饭。我说：谢谢妈妈！妈妈说：不客气。',lines:[['我家有四口人：爸爸、妈妈、妹妹和我。','Wǒ jiā yǒu sì kǒu rén: bàba, māma, mèimei hé wǒ.'],['我家有一只狗。它叫毛毛。','Wǒ jiā yǒu yì zhī gǒu. Tā jiào Máomao.'],['早上，妈妈说：“请吃早饭。”','Zǎoshang, māma shuō: “Qǐng chī zǎofàn.”'],['我说：“谢谢妈妈！”','Wǒ shuō: “Xièxie māma!”'],['妈妈说：“不客气。”','Māma shuō: “Bú kèqi.”']]},
food:{audio:'早饭我吃面包，喝牛奶。我喜欢吃鸡蛋和米饭。妹妹喜欢吃面条。爸爸喜欢喝茶。',lines:[['早饭我吃面包，喝牛奶。','Zǎofàn wǒ chī miànbāo, hē niúnǎi.'],['我喜欢吃鸡蛋和米饭。','Wǒ xǐhuan chī jīdàn hé mǐfàn.'],['妹妹喜欢吃面条。','Mèimei xǐhuan chī miàntiáo.'],['爸爸喜欢喝茶。','Bàba xǐhuan hē chá.']]},
room:{audio:'我的房间里有一张床、一张桌子和一把椅子。桌子在床的右边。椅子在桌子的前面。电脑和台灯在桌子上。书在椅子下面。毛毛在床的旁边。',lines:[['我的房间里有一张床、一张桌子和一把椅子。','Wǒ de fángjiān li yǒu yì zhāng chuáng, yì zhāng zhuōzi hé yì bǎ yǐzi.'],['桌子在床的右边。','Zhuōzi zài chuáng de yòubian.'],['椅子在桌子的前面。','Yǐzi zài zhuōzi de qiánmian.'],['电脑和台灯在桌子上。','Diànnǎo hé táidēng zài zhuōzi shang.'],['书在椅子下面。','Shū zài yǐzi xiàmian.'],['毛毛在床的旁边。','Máomao zài chuáng de pángbiān.']]},
routine:{audio:'早上七点我起床。七点半我吃早饭。八点我说：妈妈，再见！我去学校。晚上六点我吃晚饭。九点我睡觉。',lines:[['早上七点我起床。','Zǎoshang qī diǎn wǒ qǐchuáng.'],['七点半我吃早饭。','Qī diǎn bàn wǒ chī zǎofàn.'],['八点我说：“妈妈，再见！”我去学校。','Bā diǎn wǒ shuō: “Māma, zàijiàn!” Wǒ qù xuéxiào.'],['晚上六点我吃晚饭。','Wǎnshang liù diǎn wǒ chī wǎnfàn.'],['九点我睡觉。','Jiǔ diǎn wǒ shuìjiào.']]}}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deck(key,a){return cache[key]||(cache[key]=shuffle(a))}
function smartOpts(right,wrong,index){const w=shuffle(wrong),pos=index%(w.length+1);w.splice(pos,0,right);return w}
function speak(t){if(!('speechSynthesis'in window)){alert('В этом браузере нет голосового воспроизведения.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.76;speechSynthesis.speak(u)}
function listen(t,note='Можно слушать несколько раз.'){return `<div class="listen"><button onclick="speak('${t.replaceAll("'","\\'")}')">🔊 Прослушать</button><span>${note}</span></div>`}
function story(key,img){const s=stories[key];return `<div class="grid"><div><div class="story">${s.lines.map(x=>`<ruby class="storyline">${x[0]}<rt>${x[1]}</rt></ruby>`).join('')}</div>${listen(s.audio,'Сначала прочитай сама, затем проверь себя на слух.')}</div><img class="storyimg" src="${img}" alt="Иллюстрация к истории о Сяо Ане"></div>`}
function warm(title){return `<div class="warm">🎮 Разминка перед текстом</div><h2>${title}</h2>`}
function vocabChoice(title,items,key){const order=deck(key,items);return `<section class="slide">${warm(title)}<p class="lead">Нажми 🔊, послушай слово и выбери правильный иероглиф.</p><div class="cards">${order.map((x,i)=>`<div class="question"><button class="primary" onclick="speak('${x[0]}')">🔊 ${i+1}</button><div class="opts" style="margin-top:10px">${smartOpts(x[0],x[2],i).map(o=>`<button class="choice" onclick="one(this,'${o===''+x[0]}')">${o}</button>`).join('')}</div><div class="feedback"></div></div>`).join('')}</div></section>`}
function matchSlide(title,pairs,key,audio=''){const rows=deck(key,pairs);return `<section class="slide"><h2>${title}</h2>${audio?listen(audio,'Текст скрыт: восстанови ответ на слух.'):''}<div class="match">${rows.map((p,i)=>`<div class="matchrow"><span>${p[0]}</span><select data-right="${p[1]}"><option value="">Выбери…</option>${shuffle(pairs.map(x=>x[1])).map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('')}</div><button class="primary" onclick="checkMatch(this)">Проверить</button><div class="feedback"></div></section>`}
function tfSlide(title,items,key,audio=''){const rows=deck(key,items);return `<section class="slide"><h2>${title}</h2>${audio?listen(audio,'Если забыл — послушай фрагмент, не открывая текст.'):''}${rows.map((x,i)=>`<div class="question"><div class="question-title">${i+1}. ${x[0]}</div><div class="opts"><button class="choice" onclick="tf(this,${x[1]},true,'${x[2]}')">对</button><button class="choice" onclick="tf(this,${x[1]},false,'${x[2]}')">不对</button></div><div class="feedback"></div></div>`).join('')}</section>`}
function mcSlide(title,items,key,audio=''){const rows=deck(key,items);return `<section class="slide"><h2>${title}</h2>${audio?listen(audio,'Ответь, опираясь только на аудио.'):''}${rows.map((x,i)=>`<div class="question"><div class="question-title">${x.q}</div><div class="opts">${smartOpts(x.a,x.w,i).map(o=>`<button class="choice" onclick="one(this,'${o===x.a}')">${o}</button>`).join('')}</div><div class="feedback"></div></div>`).join('')}</section>`}
function clozeSlide(title,parts,choices,key,audio=''){const opts=shuffle(choices);return `<section class="slide"><h2>${title}</h2>${audio?listen(audio,'Прослушай, если нужна подсказка.'):''}<div class="cloze">${parts.map(p=>Array.isArray(p)?`<select data-right="${p[0]}"><option value="">…</option>${shuffle(opts).map(o=>`<option>${o}</option>`).join('')}</select>`:p).join('')}</div><br><button class="primary" onclick="checkMatch(this)">Проверить</button><div class="feedback"></div></section>`}
function orderSlide(title,sentences,key,audio=''){const words=deck(key,shuffleEnsure(sentences.flatMap((s,i)=>[...s,'§']))).filter(x=>x!=='§');return `<section class="slide"><h2>${title}</h2>${audio?listen(audio,'Можно восстановить фразу на слух.'):''}<p class="lead">Собери предложение. Знаки препинания уже стоят в словах.</p><div class="tokens" id="bank">${words.map(w=>`<button class="token" onclick="moveToken(this)">${w}</button>`).join('')}</div><div class="answerline" id="built"></div><button class="secondary" onclick="resetTokens()">Сбросить</button> <button class="primary" onclick="checkOrder(this,'${sentences.flat().join('')}')">Проверить</button><div class="feedback"></div></section>`}
function shuffleEnsure(a){let b=shuffle(a);if(b.join('')===a.join('')&&a.length>1)[b[0],b[1]]=[b[1],b[0]];return b}
function selfSlide(title,fields,prompt){return `<section class="slide"><h2>${title}</h2><p class="lead">Сначала ответь коротко, затем соедини ответы в маленький рассказ.</p><div class="selfgrid">${fields.map(f=>`<div class="selfbox"><label>${f[1]}</label><input class="answer-input" data-id="${f[0]}" value="${answers[f[0]]||''}" placeholder="${f[2]}"></div>`).join('')}</div><br><button class="primary" onclick="saveAnswers(this)">Сохранить ответы</button><div class="feedback"></div><h3>Опора для рассказа</h3><div class="summary">${prompt}</div></section>`}
function oddSlide(title,groups,key){return `<section class="slide">${warm(title)}<p class="lead">В каждой строке одно слово не подходит по смыслу.</p>${deck(key,groups).map((g,i)=>`<div class="question"><div class="opts">${shuffle(g.words).map(w=>`<button class="choice" onclick="one(this,'${w===g.odd}')">${w}</button>`).join('')}</div><div class="feedback"></div></div>`).join('')}</section>`}
function textSlide(num,title,key,img){return `<section class="slide"><div class="kicker">Фрагмент ${num}</div><h2>${title}</h2>${story(key,img)}</section>`}

];
function one(btn,correct){const box=btn.closest('.question');box.querySelectorAll('.choice').forEach(b=>b.disabled=true);btn.classList.add(correct==='true'?'good':'bad');const f=box.querySelector('.feedback');f.textContent=correct==='true'?'✓ Верно!':'Пока неверно. Посмотри на знаки и попробуй запомнить.';f.className='feedback '+(correct==='true'?'ok':'no');if(correct==='true')reward(btn)}
function tf(btn,truth,choice,msg){const good=truth===choice,box=btn.closest('.question');box.querySelectorAll('.choice').forEach(b=>b.disabled=true);btn.classList.add(good?'good':'bad');const f=box.querySelector('.feedback');f.textContent=(good?'✓ ':'')+(good?'Верно!':msg);f.className='feedback '+(good?'ok':'no');if(good)reward(btn)}
function checkMatch(btn){const box=btn.closest('.slide'),sels=[...box.querySelectorAll('select[data-right]')],ok=sels.every(s=>s.value===s.dataset.right);sels.forEach(s=>s.style.borderColor=s.value===s.dataset.right?'#28b99a':'#ec5c66');const f=btn.nextElementSibling;f.textContent=ok?'✓ Всё верно!':'Есть ошибки — проверь ещё раз.';f.className='feedback '+(ok?'ok':'no');if(ok)reward(btn)}
function moveToken(b){$('#built').appendChild(b)}function resetTokens(){const bank=$('#bank');$$('#built .token').forEach(x=>bank.appendChild(x))}
function checkOrder(btn,right){const got=$$('#built .token').map(x=>x.textContent).join(''),ok=got===right;const f=btn.nextElementSibling;f.textContent=ok?'✓ Отлично собрано!':'Порядок пока неверный.';f.className='feedback '+(ok?'ok':'no');if(ok)reward(btn)}
function saveAnswers(btn){$$('.answer-input').forEach(x=>answers[x.dataset.id]=x.value.trim());localStorage.setItem('danielYctAnswers',JSON.stringify(answers));const f=btn.nextElementSibling;f.textContent='✓ Сохранено. Теперь расскажи вслух.';f.className='feedback ok';reward(btn)}
function reward(btn){if(btn&&btn.dataset.done)return;if(btn)btn.dataset.done='1';score++;$('#score').textContent=score}
function buildSummary(){const a=answers,g=k=>a[k]||'……';return `我叫${g('name')}。我今年${g('age')}岁。我的生日是${g('birthday')}。我喜欢${g('color')}。\n我家有${g('family')}口人。${g('members')}。${g('pet')}。${g('petname')}。\n早饭我吃${g('breakfast')}，我喝${g('drink')}。我喜欢吃${g('likefood')}。\n我的房间里有${g('roomhas')}。桌子${g('deskwhere')}。电脑${g('computerwhere')}。\n${g('wake')}点我起床，${g('bf')}点吃早饭，${g('school')}点去学校，${g('dinner')}点吃晚饭，${g('sleep')}点睡觉。`}
async function copySummary(btn){try{await navigator.clipboard.writeText($('#selfSummary').textContent);btn.nextElementSibling.nextElementSibling.textContent='✓ Рассказ скопирован.'}catch(e){btn.nextElementSibling.nextElementSibling.textContent='Выдели текст и скопируй вручную.'}}
function chapterFor(n){let c=0;chapters.forEach((x,i)=>{if(n>=x.start)c=i});return c}
function render(){const stage=$('#stage');stage.innerHTML=slides[current]();stage.firstElementChild.classList.add('active');document.body.classList.toggle('show-pinyin',pinyin);$('#bar').style.width=((current+1)/slides.length*100)+'%';$('#prev').disabled=current===0;$('#next').textContent=current===slides.length-1?'Сначала ↻':'Дальше →';$$('.chapter').forEach((b,i)=>b.classList.toggle('active',i===chapterFor(current)));window.scrollTo({top:0,behavior:'smooth'})}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}
function resetLesson(){current=0;score=0;cache={};$('#score').textContent=0;render()}
try{answers=JSON.parse(localStorage.getItem('danielYctAnswers')||'{}')}catch(e){}
$('#route').innerHTML=chapters.map((c,i)=>`<button class="chapter" onclick="go(${c.start})">${c.name}</button>`).join('');
$('#prev').onclick=()=>go(current-1);$('#next').onclick=()=>current===slides.length-1?resetLesson():go(current+1);$('#pinBtn').onclick=()=>{pinyin=!pinyin;$('#pinBtn').textContent=pinyin?'拼音 вкл.':'拼音 выкл.';document.body.classList.toggle('show-pinyin',pinyin)};$('#restartBtn').onclick=resetLesson;render();
</script>
