(x=>x[0]===k).length} заданий</p><button onclick="start(shuffle(Q.filter(x=>x[0]===${JSON.stringify(k).replace(/"/g,'&quot;')})),false)">Начать</button></div>`).join('')}</div>`)}let run=[],pos=0,score=0,examMode=false,answers=[],timer=null,deadline=0;function exam(){let extra=shuffle(D).slice(0,20).map(x=>['Лексика',x[1],x[3],...shuffle(D.filter(y=>y[0]===x[0]&&y!==x&&y[3]!==x[3])).slice(0,3).map(y=>y[3])]);start(shuffle([...Q,...extra]).slice(0,80),true)}function start(q,e){clearInterval(timer);run=q;pos=score=0;answers=[];examMode=e;deadline=Date.now()+90*60000;show();if(e)timer=setInterval(()=>{let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));let t=document.querySelector('#clock');if(t)t.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left)finish()},1000)}function show(){if(pos>=run.length)return finish();let q=run[pos],opts=shuffle(q.slice(2));page(`<div class="card"><div>${q[0]} · ${pos+1}/${run.length} <span id="clock" style="float:right"></span></div><div class="bar"><i style="width:${100*pos/run.length}%"></i></div><pre class="${q[1].length<40?'han':''}">${esc(q[1])}</pre><div class="options">${opts.map((o,i)=>`<button data-o="${i}">${esc(o)}</button>`).join('')}</div><div id="feedback"></div></div>`);document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answer(opts[+b.dataset.o],b))}function answer(a,b){let q=run[pos],ok=a===q[2];score+=ok;answers.push([q,a,ok]);state.done++;state.correct+=ok;if(!ok)state.errors[q[1]]=q;else delete state.errors[q[1]];save();if(examMode){pos++;show();return}document.querySelectorAll('[data-o]').forEach(x=>{x.disabled=true;if(x.textContent===q[2])x.classList.add('right')});if(!ok)b.classList.add('wrong');document.querySelector('#feedback').innerHTML=`<p>${ok?'Верно!':'Правильный ответ: '+esc(q[2])}</p><button class="primary" onclick="pos++;show()">Далее</button>`}function finish(){clearInterval(timer);let stats={};answers.forEach(([q,a,o])=>{let t=stats[q[0]]||[0,0];t[0]+=o;t[1]++;stats[q[0]]=t});page(`<div class="card"><h2>Результат: ${score}/${run.length} · ${Math.round(100*score/run.length)}%</h2><p>Учебная оценка, не официальный балл CSCA.</p>${Object.entries(stats).map(([k,t])=>`<p>${k}: ${t[0]}/${t[1]}</p>`).join('')}<button onclick="errors()">Работа над ошибками</button></div>${answers.filter(x=>!x[2]).map(([q,a])=>`<div class="card"><pre>${esc(q[1])}</pre>Выбрано: ${esc(a)}<br>Ответ: ${esc(q[2])}</div>`).join('')}`)}function errors(){let a=Object.values(state.errors);page(`<h2>我的错题本 · Ошибки</h2><p>${a.length} заданий</p>${a.length?'<button class="primary" onclick="start(shuffle(Object.values(state.errors)),false)">Повторить</button>':'Пока ошибок нет.'}${a.map(q=>`<div class="card"><pre>${esc(q[1])}</pre><details><summary>Ответ</summary>${esc(q[2])}</details></div>`).join('')}`)}function formulas(){page(`<h2>公式与科学表达 · Формулы</h2><div class="grid">${[['ρ = m/V','密度等于质量除以体积','Плотность = масса / объём'],['F = ma','力等于质量乘以加速度','Второй закон Ньютона'],['I = U/R','电流等于电压除以电阻','Закон Ома'],['v = s/t','平均速度的大小（直线同向运动）等于路程除以时间','Средняя путевая скорость'],['P = W/t','平均功率等于功除以时间','Средняя мощность'],['S = πr²','圆的面积等于圆周率乘以半径的平方','Площадь круга'],['a² + b² = c²','在直角三角形中，两条直角边的平方和等于斜边的平方','Теорема Пифагора'],['2H₂ + O₂ → 2H₂O','氢气和氧气反应生成水','Уравнение реакции']].map(x=>`<div class="card"><h2>${x[0]}</h2><p>${x[1]}</p><details><summary>Пояснение</summary>${x[2]}</details></div>`).join('')}</div>`)}function sources(){page(`<div class="card"><h2>Источники и ограничения</h2><p><a href="https://csca.cn/about/examintro">Официальный формат CSCA</a> · 80 заданий, 90 минут.</p><p><a href="https://iie.gdufs.edu.cn/info/1117/5204.htm">Описание программы GDUFS</a> · математика, физика, химия, информатика, лабораторный и академический язык.</p><p><a href="https://csca.cn/testprep/examsv">Официальные материалы CSCA</a> · официальный словарь не удалось извлечь. Словарь здесь авторский тематический, не полный официальный перечень.</p><p>Дополнительный ориентир: присланный вариант 理科中文, ноябрь 2026; официальный статус не подтверждён. Все упражнения здесь авторские. Пробник содержит также переводные задания, поэтому не является точной копией формата.</p><p>Озвучивание зависит от китайского голоса устройства. Прогресс хранится локально, если браузер разрешает localStorage.</p></div>`)}home();</script></html>
