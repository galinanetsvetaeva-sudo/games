<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink)}body{min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 10% 12%,#fff5 0 4%,transparent 18%),radial-gradient(circle at 92% 28%,#fff4 0 5%,transparent 19%),linear-gradient(150deg,#8067e6,#536ed2 52%,#37a4b4);overflow-x:hidden}.app{max-width:960px;min-height:100vh;min-height:100dvh;margin:auto;padding:12px 14px 72px;display:flex;flex-direction:column}.top{position:sticky;top:6px;z-index:30;display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center;padding:9px 11px;border-radius:18px;color:#fff;background:#392a7cdd;border:1px solid #fff5;backdrop-filter:blur(10px);box-shadow:0 10px 28px #2225}.brand{font-weight:950;white-space:nowrap}.track{height:10px;background:#fff3;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--pink));transition:.35s}.stars{font-weight:900;color:var(--yellow);white-space:nowrap}.iconbtn{border:1px solid #fff5;border-radius:12px;background:#fff2;color:#fff;min-height:40px;padding:7px 10px;font-weight:850;cursor:pointer}.stage{flex:1;display:grid;place-items:center;padding:14px 0}.panel{width:100%;background:linear-gradient(145deg,#fff,#fff9ed);border:3px solid #fff9;border-radius:28px;padding:clamp(20px,4vw,38px);box-shadow:0 22px 60px #25346d55;animation:pop .3s ease}@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.99)}to{opacity:1;transform:none}}h1{font-size:clamp(38px,7vw,64px);line-height:1.03;margin:0 0 12px}h2{font-size:clamp(27px,5vw,40px);line-height:1.12;margin:0 0 12px}.lead{font-size:18px;line-height:1.5}.eyebrow{font-size:13px;font-weight:950;text-transform:uppercase;letter-spacing:.09em;color:var(--violet)}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:center}.wheel{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(var(--pink),var(--yellow),var(--mint),var(--blue),#9c7af0,var(--pink));border:10px solid #fff;box-shadow:0 16px 35px #4d3bb066;color:white;font-size:clamp(50px,10vw,96px)}.wheel span{filter:drop-shadow(0 4px 3px #53428a88)}.btn,.choice,.sound,.catbtn,.chip,.smallbtn{border:0;border-radius:16px;min-height:52px;padding:12px 17px;font:inherit;font-weight:900;cursor:pointer;touch-action:manipulation;transition:.15s}.btn{color:#fff;background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 7px 0 var(--violet2),0 12px 20px #6e53d844}.btn:active,.choice:active,.sound:active,.catbtn:active,.smallbtn:active{transform:translateY(3px);box-shadow:none}.btn.secondary{background:linear-gradient(135deg,#3292c8,var(--mint));box-shadow:0 7px 0 #247896}.note{padding:13px 15px;border-radius:14px;background:#fff0bd;border-left:6px solid var(--yellow);line-height:1.45}.tabs{display:flex;gap:7px;overflow:auto;padding:4px 2px 9px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:2px solid #ded5fb;background:#fff;color:#51449c;border-radius:99px;padding:9px 13px;font-weight:850;cursor:pointer}.tab.active{background:var(--violet);color:#fff;border-color:var(--violet)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.wordcard{position:relative;min-height:178px;border:2px solid #e2dbf4;border-radius:19px;background:#fff;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #e6e0f3}.emoji{font-size:43px;line-height:1.1}.hanzi{font-size:31px;font-weight:950;margin:5px 0}.meta{font-size:14px;line-height:1.35;min-height:39px;color:#60587a}.meta.covered{filter:blur(6px);user-select:none}.wordcard .sound{min-height:40px;padding:7px 12px;background:#ede8ff;color:#563bb5;margin-top:7px}.round{color:var(--violet);font-weight:900;margin-bottom:8px}.listen{padding:18px;text-align:center;border-radius:22px;background:linear-gradient(135deg,#efeaff,#e6fbff);border:2px dashed #9a85e2}.listen .sound{min-width:190px;background:#fff;color:var(--violet);border:2px solid #cbbff0;box-shadow:0 5px 0 #ddd5f5}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:18px 0}.choice{background:#fff;border:2px solid #dce2ec;color:var(--ink);box-shadow:0 6px 0 #dce3eb;font-size:18px}.choice .emoji{display:block;font-size:47px}.choice .hanzi{font-size:28px}.choice.correct{background:#ddf7ec;border-color:var(--good);box-shadow:0 6px 0 #a9dec9}.choice.wrong{background:#ffe2e8;border-color:var(--bad);box-shadow:0 6px 0 #efbac4}.feedback{min-height:52px;padding:11px 13px;border-radius:13px;font-weight:850;line-height:1.4}.feedback:empty{padding:0}.feedback.good{background:#ddf7ec;color:#08704d}.feedback.bad{background:#ffe2e8;color:#a12d46}.bigword{text-align:center;font-size:clamp(54px,12vw,96px);font-weight:950;color:var(--violet);margin:12px}.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.catbtn{background:#fff;border:2px solid #ddd5f3;box-shadow:0 5px 0 #e3dcf0;color:#403966}.scenegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}.scene{border:2px solid #e2d8f6;background:#fff;border-radius:20px;padding:14px;text-align:center}.scene .art{min-height:88px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:48px;background:linear-gradient(135deg,#f4f0ff,#eefcff);border-radius:15px;margin-bottom:10px}.scene h3{margin:4px 0;font-size:24px}.scene p{margin:5px 0;line-height:1.4}.scene .sound{width:100%;min-height:42px;background:#ede8ff;color:#5539af}.badge{display:inline-block;padding:5px 9px;background:#fff0bc;color:#785d12;border-radius:99px;font-size:13px;font-weight:900}.build{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:18px 0;padding:15px;border-radius:18px;background:#f1edff;min-height:76px}.chip{min-height:45px;background:#fff;border:2px solid #d5caef;color:#3d3560;box-shadow:0 4px 0 #ded7eb}.answerline{min-height:70px;background:#fff;border:2px dashed #aa98dd;border-radius:17px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}.answerline .chip{background:#e6fbf5;border-color:#8dd9c4}.phrasevisual{display:flex;justify-content:center;align-items:center;gap:15px;margin:15px 0}.swatch{width:62px;height:62px;border-radius:50%;border:6px solid #fff;box-shadow:0 5px 15px #3333}.story{font-size:clamp(23px,4vw,32px);line-height:1.8;padding:19px;background:#fff;border-radius:20px;border:2px solid #e2d9f5}.pinyin{display:none;color:#796aa4;font-size:.58em;font-weight:600}.showpy .pinyin{display:inline}.storypics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.storypic{border:2px solid #dfd7ef;border-radius:18px;background:#fff;padding:12px;text-align:center;cursor:pointer;box-shadow:0 5px 0 #e6dfed}.storypic .art{font-size:36px;line-height:1.5;min-height:108px}.storypic.correct{background:#ddf7ec;border-color:var(--good)}.qbox{padding:13px 0;border-top:1px solid #e8e3ef}.qbox b{font-size:19px}.qopts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.smallbtn{min-height:42px;background:#eee9ff;color:#4f39a3;border:2px solid #d8cef5}.smallbtn.correct{background:#d9f7ea;border-color:var(--good);color:#08704d}.smallbtn.wrong{background:#ffe0e7;border-color:var(--bad);color:#a52f49}.nav{position:fixed;z-index:40;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#352676 76%,transparent)}.nav button{border:1px solid #fff5;border-radius:14px;background:#fff2;color:#fff;min-height:48px;min-width:130px;padding:10px 16px;font-weight:900}.nav button:disabled{opacity:.25}.footer{text-align:center;color:#fff9;font-size:13px;padding:10px}.result{text-align:center}.medal{font-size:86px}.scorebig{font-size:52px;color:var(--violet);font-weight:950}.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}.confetti i{position:absolute;top:-20px;width:10px;height:18px;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:700px){.app{padding:7px 8px calc(72px + env(safe-area-inset-bottom))}.top{top:4px;grid-template-columns:auto 1fr auto;padding:7px 8px}.brand{font-size:13px}.stars{display:none}.iconbtn{font-size:0;width:42px;padding:5px}.iconbtn:after{content:'⛶';font-size:21px}.stage{display:block;padding:9px 0}.panel{min-height:calc(100dvh - 130px);padding:20px 14px;border-radius:23px;display:flex;flex-direction:column;justify-content:center}.hero{grid-template-columns:1fr;text-align:center}.wheel{max-width:150px;margin:auto;font-size:63px;border-width:7px}.cards{grid-template-columns:repeat(2,1fr)}.wordcard:last-child:nth-child(odd){grid-column:1/-1}.choices,.catgrid,.storypics{grid-template-columns:1fr}.scenegrid{grid-template-columns:1fr}.storypic .art{min-height:70px}.nav button{min-width:0;flex:1}.story{font-size:22px}.lead{font-size:17px}}
.catbtn.correct{background:#ddf7ec;border-color:var(--good);box-shadow:0 6px 0 #a9dec9}.catbtn.wrong,.storypic.wrong{background:#ffe2e8;border-color:var(--bad);box-shadow:0 6px 0 #efbac4}
</style>

<body>
<div class="app">
 <header class="top"><div class="brand">Дашина карусель</div><div class="track"><div class="bar" id="bar"></div></div><div class="stars" id="stars">★ 0</div><button class="iconbtn" id="full">На весь экран</button></header>
 <main class="stage" id="stage"></main>
 <footer class="footer">by Galina Netsvetaeva</footer>
</div>

<script>
const cats={
 weather:{name:'Погода',icon:'🌦️',words:[['冷','lěng','холодно','🥶'],['热','rè','жарко','🔥'],['晴天','qíngtiān','солнечная погода','☀️'],['下雨','xiàyǔ','идёт дождь','🌧️'],['下雪','xiàxuě','идёт снег','🌨️']]},
 clothes:{name:'Одежда',icon:'👗',words:[['衣服','yīfu','одежда','👕'],['裙子','qúnzi','юбка','👗'],['裤子','kùzi','брюки','👖'],['鞋','xié','обувь','👟'],['帽子','màozi','шапка / шляпа','🧢']]},
 transport:{name:'Транспорт',icon:'🚌',words:[['汽车','qìchē','машина','🚗'],['公共汽车','gōnggòng qìchē','автобус','🚌'],['火车','huǒchē','поезд','🚆'],['飞机','fēijī','самолёт','✈️'],['自行车','zìxíngchē','велосипед','🚲']]},
 colors:{name:'Цвета',icon:'🎨',words:[['红色','hóngsè','красный','🔴'],['蓝色','lánsè','синий','🔵'],['黄色','huángsè','жёлтый','🟡'],['绿色','lǜsè','зелёный','🟢'],['白色','báisè','белый','⚪']]},
 family:{name:'Семья',icon:'👨‍👩‍👧',words:[['妈妈','māma','мама','👩'],['爸爸','bàba','папа','👨'],['哥哥','gēge','старший брат','👦'],['姐姐','jiějie','старшая сестра','👧'],['妹妹','mèimei','младшая сестра','👧🏻']]},
 animals:{name:'Животные',icon:'🐼',words:[['猫','māo','кошка','🐈'],['狗','gǒu','собака','🐕'],['熊猫','xióngmāo','панда','🐼'],['马','mǎ','лошадь','🐎'],['鸟','niǎo','птица','🐦']]}
};
const C=Object.entries(cats),all=C.flatMap(([cat,o])=>o.words.map(w=>({h:w[0],p:w[1],r:w[2],e:w[3],cat}))),byH=h=>all.find(w=>w.h===h),shuffle=a=>[...a].sort(()=>Math.random()-.5);
let page=0,score=0,earned=new Set(),voice=null,reviewCat='weather',audioQ=[],audioI=0,locked=false,sortQ=[],sortI=0,phraseQ=[],phraseI=0,buildQ=[],buildI=0,storyAnswers=new Set();
function voices(){const z=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang)),m=/Yunxi|Yunjian|Yunyang|Kangkang|Li[- ]?mu|Eddy|Reed|Rocko|\bmale\b/i;voice=z.find(v=>m.test(v.name))||z.find(v=>/^zh[-_]CN/i.test(v.lang))||z[0]||null}
voices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=voices;
function speak(t){speechSynthesis.cancel();voices();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.7;u.pitch=.88;if(voice)u.voice=voice;speechSynthesis.speak(u)}
function addStar(id){if(!earned.has(id)){earned.add(id);score++;document.getElementById('stars').textContent='★ '+score}}
function intro(){return `<section class="panel hero"><div><div class="eyebrow">Домашняя миссия</div><h1>Карусель<br>знакомых слов</h1><p class="lead">Ничего нового! Спокойно вспомним погоду, одежду, транспорт, цвета, семью и животных.</p><div class="note">Сначала слушай и вспоминай. Потом одни и те же слова будут возвращаться в играх, словосочетаниях, предложениях и маленькой истории.</div><br><button class="btn" onclick="go(1)">Начать повторение →</button></div><div class="wheel"><span>🌦️<br>👗🚌<br>🐼</span></div></section>`}
function review(){const o=cats[reviewCat];return `<section class="panel"><div class="eyebrow">Шаг 1 · вспоминаем</div><h2>Послушай знакомые слова</h2><p class="lead">Нажми на 🔊, затем на карточку — проверь себя.</p><div class="tabs">${C.map(([k,v])=>`<button class="tab ${k===reviewCat?'active':''}" onclick="setReview('${k}')">${v.icon} ${v.name}</button>`).join('')}</div><div class="cards">${o.words.map((w,i)=>`<div class="wordcard" onclick="this.querySelector('.meta').classList.toggle('covered')"><div class="emoji">${w[3]}</div><div class="hanzi">${w[0]}</div><div class="meta covered"><b>${w[1]}</b><br>${w[2]}</div><button class="sound" onclick="event.stopPropagation();speak('${w[0]}');addStar('listen-${reviewCat}-${i}')">🔊</button></div>`).join('')}</div><div class="note">Пройди все вкладки сверху. Перевод можно снова спрятать нажатием на карточку.</div></section>`}
function setReview(k){reviewCat=k;render(review())}
function startAudio(){audioQ=shuffle(C.flatMap(([k,o])=>shuffle(o.words).slice(0,2).map(w=>byH(w[0]))));audioI=0;locked=false;return audioGame()}
function audioGame(){const w=audioQ[audioI],others=shuffle(all.filter(x=>x.h!==w.h&&x.cat!==w.cat)).slice(0,2);return `<section class="panel"><div class="round">Шаг 2 · слушаем · ${audioI+1} из ${audioQ.length}</div><h2>Какое слово прозвучало?</h2><div class="listen"><button class="sound" onclick="speak('${w.h}')">🔊 Послушать ещё раз</button></div><div class="choices">${shuffle([w,...others]).map(x=>`<button class="choice" onclick="answerAudio('${x.h}',this)"><span class="emoji">${x.e}</span></button>`).join('')}</div><div class="feedback" id="fb"></div></section>`}
function answerAudio(h,b){if(locked)return;locked=true;const w=audioQ[audioI],ok=h===w.h;b.classList.add(ok?'correct':'wrong');document.querySelectorAll('.choice').forEach(x=>x.disabled=true);const f=document.getElementById('fb');f.className='feedback '+(ok?'good':'bad');f.innerHTML=(ok?'Да! ':'Сейчас вспомним: ')+`<b>${w.h}</b> · ${w.p} — ${w.r}`;if(ok)addStar('audio-'+audioI);setTimeout(()=>{if(audioI<audioQ.length-1){audioI++;locked=false;render(audioGame())}else go(3)},1500)}
function startSort(){sortQ=shuffle(C.flatMap(([k,o])=>shuffle(o.words).slice(0,3).map(w=>byH(w[0]))));sortI=0;locked=false;return sortGame()}
function sortGame(){const w=sortQ[sortI];return `<section class="panel"><div class="round">Шаг 3 · раскладываем · ${sortI+1} из ${sortQ.length}</div><h2>К какой теме относится слово?</h2><div class="bigword">${w.h}</div><div class="catgrid">${C.map(([k,o])=>`<button class="catbtn" onclick="answerSort('${k}',this)">${o.icon}<br>${o.name}</button>`).join('')}</div><div class="feedback" id="fb"></div></section>`}
function answerSort(k,b){if(locked)return;locked=true;const w=sortQ[sortI],ok=k===w.cat;b.classList.add(ok?'correct':'wrong');document.querySelectorAll('.catbtn').forEach(x=>x.disabled=true);const f=document.getElementById('fb');f.className='feedback '+(ok?'good':'bad');f.innerHTML=`${ok?'Верно!':'Это другая полочка.'} <b>${w.h}</b> · ${w.p} — ${w.r}`;speak(w.h);if(ok)addStar('sort-'+sortI);setTimeout(()=>{if(sortI<sortQ.length-1){sortI++;locked=false;render(sortGame())}else go(4)},1350)}
const phrases=[
 {vis:'🔴 ＋ 👗',ans:'红色的裙子',audio:'红色的裙子',opts:['红色的裙子','蓝色的裙子','红色的裤子'],ru:'красная юбка'},
 {vis:'🔵 ＋ 👖',ans:'蓝色的裤子',audio:'蓝色的裤子',opts:['蓝色的裤子','绿色的裤子','蓝色的衣服'],ru:'синие брюки'},
 {vis:'⚪ ＋ 👟',ans:'白色的鞋',audio:'白色的鞋',opts:['白色的鞋','黄色的鞋','白色的帽子'],ru:'белая обувь'},
 {vis:'🟡 ＋ 🧢',ans:'黄色的帽子',audio:'黄色的帽子',opts:['黄色的帽子','红色的帽子','黄色的衣服'],ru:'жёлтая шапка'},
 {vis:'👩 ＋ 🚌',ans:'妈妈坐公共汽车',audio:'妈妈坐公共汽车',opts:['妈妈坐公共汽车','妈妈坐火车','姐姐坐公共汽车'],ru:'мама едет на автобусе'},
 {vis:'👨 ＋ 🚲',ans:'爸爸骑自行车',audio:'爸爸骑自行车',opts:['爸爸骑自行车','哥哥骑自行车','爸爸坐汽车'],ru:'папа едет на велосипеде'},
 {vis:'👧 ＋ 🐼',ans:'姐姐喜欢熊猫',audio:'姐姐喜欢熊猫',opts:['姐姐喜欢熊猫','妹妹喜欢熊猫','姐姐喜欢猫'],ru:'старшая сестра любит панду'},
 {vis:'👧🏻 ＋ 🐎',ans:'妹妹喜欢马',audio:'妹妹喜欢马',opts:['妹妹喜欢马','妈妈喜欢马','妹妹喜欢狗'],ru:'младшая сестра любит лошадь'}
];
function startPhrases(){phraseQ=shuffle(phrases);phraseI=0;locked=false;return phraseGame()}
function phraseGame(){const q=phraseQ[phraseI];return `<section class="panel"><div class="round">Шаг 4 · соединяем · ${phraseI+1} из ${phraseQ.length}</div><h2>Выбери словосочетание</h2><div class="phrasevisual"><div class="emoji">${q.vis}</div></div><p style="text-align:center"><b>${q.ru}</b></p><div class="choices">${shuffle(q.opts).map(x=>`<button class="choice" onclick="answerPhrase('${x}',this)"><span class="hanzi">${x}</span></button>`).join('')}</div><div class="feedback" id="fb"></div></section>`}
function answerPhrase(a,b){if(locked)return;locked=true;const q=phraseQ[phraseI],ok=a===q.ans;b.classList.add(ok?'correct':'wrong');document.querySelectorAll('.choice').forEach(x=>x.disabled=true);const f=document.getElementById('fb');f.className='feedback '+(ok?'good':'bad');f.innerHTML=(ok?'Получилось! ':'Соберём так: ')+`<b>${q.ans}</b>`;speak(q.audio);if(ok)addStar('phrase-'+phraseI);setTimeout(()=>{if(phraseI<phraseQ.length-1){phraseI++;locked=false;render(phraseGame())}else go(5)},1450)}
const climbs=[
 {art:'👧 ➜ 🏔️',h:'爬山',p:'páshān',r:'подниматься в горы'},
 {art:'👧 ➜ 🛏️',h:'爬上床',p:'pá shàng chuáng',r:'забраться на кровать'},
 {art:'👧 ➜ 👩',h:'爬到妈妈身上',p:'pá dào māma shēnshang',r:'забраться на маму'},
 {art:'👧 ➜ 🐢',h:'爬到乌龟背上',p:'pá dào wūguī bèi shàng',r:'забраться на спину черепахи'}
];
function climbLab(){return `<section class="panel"><div class="eyebrow">Бонус · Дашино слово</div><h2>Куда ещё можно 爬? 😄</h2><p class="lead">На уроке ты услышала <b>爬山</b> и сразу придумала <b>爬床</b>. Смысл пойман отлично! Нажимай на картинки и слушай, как сказать эти смешные фразы естественнее.</p><div class="scenegrid">${climbs.map((x,i)=>`<div class="scene"><div class="art">${x.art}</div><span class="badge">Нажми и послушай</span><h3>${x.h}</h3><p><b>${x.p}</b></p><p>${x.r}</p><button class="sound" onclick="speak('${x.h}');addStar('climb-${i}')">🔊 ${x.h}</button></div>`).join('')}</div><div class="note">По-китайски чаще говорят не просто 爬床, а <b>爬上床</b>: буквально «вскарабкаться наверх на кровать».</div></section>`}
const builds=[
 {s:'今天很冷',t:['今天','很','冷'],ru:'Сегодня холодно.'},
 {s:'我喜欢红色的裙子',t:['我','喜欢','红色的','裙子'],ru:'Мне нравится красная юбка.'},
 {s:'妈妈坐公共汽车',t:['妈妈','坐','公共汽车'],ru:'Мама едет на автобусе.'},
 {s:'姐姐喜欢熊猫',t:['姐姐','喜欢','熊猫'],ru:'Старшая сестра любит панду.'},
 {s:'爸爸骑自行车',t:['爸爸','骑','自行车'],ru:'Папа едет на велосипеде.'},
 {s:'我们去爬山',t:['我们','去','爬山'],ru:'Мы идём в горы.'}
];
let chosen=[];
function startBuild(){buildQ=shuffle(builds);buildI=0;chosen=[];locked=false;return buildGame()}
function buildGame(){const q=buildQ[buildI],pool=shuffle(q.t.map((x,i)=>({x,id:i})));window.pool=pool;return `<section class="panel"><div class="round">Шаг 5 · строим фразы · ${buildI+1} из ${buildQ.length}</div><h2>Собери предложение</h2><p class="lead" style="text-align:center">${q.ru}</p><div class="answerline" id="answer"><span style="color:#8a829d">Нажимай на слова по порядку</span></div><div class="build" id="pool">${pool.map((x,i)=>`<button class="chip" onclick="pickToken(${i},this)">${x.x}</button>`).join('')}</div><button class="btn secondary" onclick="checkBuild()">Проверить</button><div class="feedback" id="fb"></div></section>`}
function pickToken(i,b){if(locked||b.disabled)return;b.disabled=true;b.style.opacity=.35;chosen.push(window.pool[i]);drawChosen()}
function drawChosen(){const a=document.getElementById('answer');a.innerHTML=chosen.map((x,i)=>`<button class="chip" onclick="unpick(${i})">${x.x}</button>`).join('')||'<span style="color:#8a829d">Нажимай на слова по порядку</span>'}
function unpick(i){if(locked)return;const x=chosen.splice(i,1)[0],idx=window.pool.indexOf(x),buttons=document.querySelectorAll('#pool .chip');buttons[idx].disabled=false;buttons[idx].style.opacity=1;drawChosen()}
function checkBuild(){if(locked)return;const q=buildQ[buildI],made=chosen.map(x=>x.x).join(''),f=document.getElementById('fb');if(made!==q.s){f.className='feedback bad';f.textContent=chosen.length<q.t.length?'Ещё не все слова заняли свои места.':'Почти! Нажми на слова в строке и попробуй другой порядок.';return}locked=true;f.className='feedback good';f.innerHTML=`Отлично! <b>${q.s}</b>`;speak(q.s);addStar('build-'+buildI);setTimeout(()=>{if(buildI<buildQ.length-1){buildI++;chosen=[];locked=false;render(buildGame())}else go(7)},1500)}
const storyText='今天天气很好，是晴天。妈妈穿红色的衣服，我穿蓝色的裤子和白色的鞋。我们坐公共汽车去爬山。山上有一只狗和一只鸟。我们很开心。';
const storyPy='Jīntiān tiānqì hěn hǎo, shì qíngtiān. Māma chuān hóngsè de yīfu, wǒ chuān lánsè de kùzi hé báisè de xié. Wǒmen zuò gōnggòng qìchē qù páshān. Shān shàng yǒu yì zhī gǒu hé yì zhī niǎo. Wǒmen hěn kāixīn.';
const storyQs=[
 {q:'今天天气怎么样？',a:'晴天',o:['晴天','下雨','下雪']},
 {q:'妈妈穿什么颜色的衣服？',a:'红色',o:['红色','蓝色','白色']},
 {q:'她们坐什么去爬山？',a:'公共汽车',o:['公共汽车','火车','飞机']},
 {q:'山上有什么动物？',a:'狗和鸟',o:['狗和鸟','猫和马','熊猫和狗']}
];
function story(){return `<section class="panel"><div class="eyebrow">Финал · маленькая история</div><h2>Послушай и выбери картинку</h2><div class="story"><button class="smallbtn" onclick="speak('${storyText}')">🔊 Весь текст</button> <button class="smallbtn" onclick="this.closest('.panel').classList.toggle('showpy')">拼 Пиньинь</button><br>${storyText}<div class="pinyin">${storyPy}</div></div><div class="storypics"><button class="storypic" onclick="pickStoryPic(this,false)"><div class="art">🌧️ 🚆 🐼<br>🟢👗</div><b>Картинка 1</b></button><button class="storypic" onclick="pickStoryPic(this,true)"><div class="art">☀️ 🚌 🏔️<br>🔴👕 🔵👖 🐕🐦</div><b>Картинка 2</b></button><button class="storypic" onclick="pickStoryPic(this,false)"><div class="art">🌨️ ✈️ 🐈<br>🟡🧢</div><b>Картинка 3</b></button></div><div class="feedback" id="picfb"></div><h2 style="font-size:26px;margin-top:20px">Ответь на вопросы</h2>${storyQs.map((q,i)=>`<div class="qbox"><b>${q.q}</b><div class="qopts">${shuffle(q.o).map(o=>`<button class="smallbtn" onclick="storyAnswer(${i},'${o}',this)">${o}</button>`).join('')}</div></div>`).join('')}<button class="btn" style="width:100%;margin-top:12px" onclick="finishStory()">Завершить миссию →</button></section>`}
function pickStoryPic(b,ok){const f=document.getElementById('picfb');b.classList.add(ok?'correct':'wrong');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'Да! Здесь солнечно, мама в красном, они едут на автобусе в горы и встречают собаку и птицу.':'Не эта картинка. Послушай текст ещё раз и проверь погоду и транспорт.';if(ok){document.querySelectorAll('.storypic').forEach(x=>x.disabled=true);addStar('story-pic')}else setTimeout(()=>b.classList.remove('wrong'),700)}
function storyAnswer(i,a,b){if(storyAnswers.has(i))return;const q=storyQs[i],ok=a===q.a;b.classList.add(ok?'correct':'wrong');if(ok){storyAnswers.add(i);b.parentElement.querySelectorAll('button').forEach(x=>x.disabled=true);addStar('story-q-'+i)}else setTimeout(()=>b.classList.remove('wrong'),700)}
function finishStory(){if(storyAnswers.size<4){alert('Ответь на все четыре вопроса — у тебя получится!');return}go(8)}
function finish(){setTimeout(fireworks,250);return `<section class="panel result"><div class="medal">🏆</div><div class="eyebrow">Повторение завершено</div><h2>Знакомые слова вернулись!</h2><div class="scorebig">${score} ★</div><p class="lead">Ты слушала, вспоминала, сортировала, соединяла слова и прочитала целую историю. А ещё выяснила, куда можно 爬 😄</p><button class="btn" onclick="location.reload()">Прокатиться ещё раз</button></section>`}
const pages=[intro,review,startAudio,startSort,startPhrases,climbLab,startBuild,story,finish];
function render(html){document.getElementById('stage').innerHTML=html;document.getElementById('bar').style.width=(page/(pages.length-1)*100)+'%';document.getElementById('prev').disabled=page===0||[2,3,4,6].includes(page);document.getElementById('next').disabled=page===pages.length-1||[2,3,4,6,7].includes(page);scrollTo({top:0,behavior:'smooth'})}
function go(n){page=Math.max(0,Math.min(pages.length-1,n));if(page===2)render(startAudio());else if(page===3)render(startSort());else if(page===4)render(startPhrases());else if(page===6)render(startBuild());else render(pages[page]())}
document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
function fireworks(){const c=document.getElementById('confetti'),co=['#ffd568','#54d1b3','#ff79a8','#8b70ea','#fff'];for(let i=0;i<65;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.background=co[i%co.length];x.style.animationDelay=Math.random()*.8+'s';c.appendChild(x)}setTimeout(()=>c.innerHTML='',3500)}
go(0);
</script>
</body>
</html>
