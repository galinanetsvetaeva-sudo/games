<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>你好 · Китайский в общении</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#203e3a;font:17px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{background:#173f39;color:#fff;border-radius:26px;padding:32px}h1{font-size:clamp(28px,5vw,48px);margin:10px 0}small{letter-spacing:2px}button,select{font:inherit;border:1px solid #c9d9d1;border-radius:14px;padding:12px;background:#fff;color:#173f39;cursor:pointer}button:hover{background:#e0eee5}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.active{background:#173f39;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.card,#quiz{background:white;border-radius:22px;padding:22px;box-shadow:0 5px 20px #183e3910}.han{font-size:clamp(28px,5vw,43px);font-family:KaiTi,'PingFang SC',sans-serif}.py{color:#a35c37;margin:8px 0}.ru{margin:12px 0;color:#526660}.hide{visibility:hidden}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.opts{display:grid;gap:10px;margin:20px 0}.good{background:#ccebd6!important}.bad{background:#f8d5cf!important}progress{width:100%;accent-color:#28765c}#status{min-height:24px;color:#a35c37}footer{font-size:13px;margin-top:24px;color:#526660}
</style><main><header><small>MANDARIN SCHOOL · 中文</small><h1>你好！ Как дела?</h1><p>Слушай, повторяй, запоминай и проверяй себя.</p></header><nav id="nav"></nav><div class="tools"><select id="group"></select><button id="pinyin">Пиньинь: вкл.</button><button id="translation">Перевод: выкл.</button><button id="slow">Скорость: обычная</button></div><div id="status" role="status"></div><section id="view"></section><footer>Озвучивание: китайский голос устройства (синтез речи). При отсутствии голоса установите китайский язык в настройках устройства.</footer></main><script>
const D=[["你好","nǐ hǎo","Привет / здравствуйте",0],["您好","nín hǎo","Здравствуйте (вежливо)",0],["大家好","dàjiā hǎo","Всем привет / здравствуйте",0],["老师好","lǎoshī hǎo","Здравствуйте, учитель",0],["早上好","zǎoshang hǎo","Доброе утро",0],["下午好","xiàwǔ hǎo","Добрый день",0],["晚上好","wǎnshang hǎo","Добрый вечер",0],["喂","wéi","Алло",0],["你吃了吗？","nǐ chī le ma","Ты ел/ела?",0],["嗨","hāi","Hi!",0],["嘿","hēi","Hey!",0],["哈喽","hā lou","Hello!",0],["你怎么样？","nǐ zěnmeyàng","Как поживаешь?",1],["你最近怎么样？","nǐ zuìjìn zěnmeyàng","Как поживаешь в последнее время?",1],["你的生活怎么样？","nǐ de shēnghuó zěnmeyàng","Как твоя жизнь?",1],["怎么样","zěnmeyàng","Как, каким образом?",1],["最近","zuìjìn","Недавно, в последнее время",1],["生活","shēnghuó","Жизнь",1],["太棒了","tài bàng le","Здорово, великолепно, круто; молодец",2],["超棒的","chāo bàng de","Супер, круто, классно",2],["好极了","hǎo jí le","Превосходно! Чудесно!",2],["太好了","tài hǎo le","Очень хорошо! Прекрасно!",2],["非常好","fēicháng hǎo","Отлично, великолепно",2],["很好","hěn hǎo","Хорошо, замечательно",2],["还行","hái xíng","Неплохо, пойдёт, ничего",2],["还可以","hái kěyǐ","Так себе, более-менее, терпимо",2],["很忙","hěn máng","Занят",2],["不错","bú cuò","Неплохо, недурно, славно, хорошо",2],["不好","bù hǎo","Плохо",2],["糟糕","zāogāo","Ужасно, кошмар, всё плохо",2],["累死了","lèi sǐ le","Устал/а до смерти",2],["一般般","yībānbān","Так себе, кое-как, более-менее",2],["凑合","còuhe","Кое-как, приемлемо, сойдёт",2],["上课","shàng kè","Начало урока / урок начался",3],["下课","xià kè","Конец урока / урок окончен",3],["再说一遍","zài shuō yí biàn","Ещё раз скажите",3],["对","duì","Правильно",3],["不对","bú duì","Неправильно",3],["错","cuò","Ошибочно",3],["我明白","wǒ míngbai","Я понимаю",3],["我不明白","wǒ bù míngbai","Я не понимаю",3],["我知道","wǒ zhīdào","Я знаю",3],["我不知道","wǒ bù zhīdào","Я не знаю",3],["我有一个问题","wǒ yǒu yí ge wèntí","У меня есть вопрос",3],["这个对吗？","zhè ge duì ma","Это правильно?",3],["再见","zàijiàn","До свидания, пока",4],["拜拜","bàibai","Пока",4],["明天见","míngtiān jiàn","Завтра увидимся",4]];
const groups=['Приветствия','Как дела?','Ответы','На уроке','Прощание'], modes=['Словарь','Повторение','На слух','Значение','Иероглифы'];let mode=0,py=true,ru=false,rate=0.9,idx=0,deck=[],score=0,wrong=[],locked=false;const $=id=>document.getElementById(id),v=$('view');function shuffle(a){return [...a].sort(()=>0.5-Math.random())}function pool(){return D.filter(x=>$('group').value==='all'||x[3]==+$('group').value)}function say(s,done){if(!window.speechSynthesis){$('status').textContent='Озвучивание не поддерживается';return}speechSynthesis.cancel();let voices=speechSynthesis.getVoices(),voice=voices.find(x=>/zh[-_]CN/i.test(x.lang))||voices.find(x=>/^zh/i.test(x.lang));let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';if(voice)u.voice=voice;u.rate=rate;u.onend=()=>{if(done)done()};u.onerror=()=>{$('status').textContent='Не удалось воспроизвести звук. Проверьте китайский голос устройства.'};speechSynthesis.speak(u)}function card(x){return '<div class="han">'+x[0]+'</div><div class="py '+(py?'':'hide')+'">'+x[1]+'</div><div class="ru '+(ru?'':'hide')+'">'+x[2]+'</div>'}function btn(t,f,parent=v){let b=document.createElement('button');b.textContent=t;b.onclick=f;parent.append(b);return b}function start(m){mode=m;idx=0;score=0;wrong=[];deck=m===1?pool():shuffle(pool());render()}function render(){document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('active',i===mode));v.innerHTML='';$('status').textContent='';if(mode===0){let grid=document.createElement('div');grid.className='grid';v.append(grid);pool().forEach(x=>{let c=document.createElement('article');c.className='card';c.innerHTML=card(x);grid.append(c);btn('🔊 Слушать',()=>say(x[0]),c);btn('Перевод',()=>c.querySelector('.ru').classList.toggle('hide'),c)});return}if(idx>=deck.length){v.innerHTML='<div id="quiz"><h2>Готово!</h2><p>'+ (mode===1?'Повторено: '+deck.length:'Правильно: '+score+' из '+deck.length)+'</p></div>';let q=$('quiz');btn('Начать заново',()=>start(mode),q);if(wrong.length)btn('Повторить ошибки',()=>{deck=[...wrong];wrong=[];idx=score=0;render()},q);return}let x=deck[idx];v.innerHTML='<div id="quiz"><progress max="'+deck.length+'" value="'+idx+'"></progress><p>'+ (idx+1)+' / '+deck.length+'</p></div>';let q=$('quiz');locked=false;if(mode===1){q.insertAdjacentHTML('beforeend',card(x));btn('🔊 Слушать',()=>say(x[0]),q);btn('Слушать дважды',()=>say(x[0],()=>setTimeout(()=>say(x[0]),900)),q);btn('Показать перевод',()=>q.querySelector('.ru').classList.toggle('hide'),q);btn('Назад',()=>{idx=Math.max(0,idx-1);render()},q);btn('Повторил →',()=>{idx++;render()},q);return}let prompt=mode===2?'Прослушай и выбери услышанное':mode===3?'Выбери перевод':'Выбери китайское выражение';q.insertAdjacentHTML('beforeend','<h2>'+prompt+'</h2>');if(mode===2)btn('🔊 Прослушать',()=>say(x[0]),q);else q.insertAdjacentHTML('beforeend',mode===3?'<div class="han">'+x[0]+'</div>':'<p>'+x[2]+'</p>');let opts=document.createElement('div');opts.className='opts';q.append(opts);let field=mode===3?2:0;let distract=shuffle(D.filter(y=>y!==x&&y[2]!==x[2]&&y[0]!==x[0]&&(mode===2||y[3]!==x[3]))).slice(0,3);shuffle([x,...distract]).forEach(y=>{let b=btn(y[field],()=>{if(locked)return;locked=true;if(y===x){score++;b.classList.add('good')}else{wrong.push(x);b.classList.add('bad');[...opts.children].find(z=>z.textContent===x[field]).classList.add('good')}feedback.textContent=x[0]+' · '+x[1]+' · '+x[2];next.disabled=false;say(x[0])},opts)});let feedback=document.createElement('p');q.append(feedback);let next=btn('Далее →',()=>{idx++;render()},q);next.disabled=true} $('group').innerHTML='<option value="all">Все темы · '+D.length+'</option>'+groups.map((g,i)=>'<option value="'+i+'">'+g+'</option>').join('');modes.forEach((m,i)=>btn(m,()=>start(i),$('nav')));$('group').onchange=()=>start(mode);$('pinyin').onclick=()=>{py=!py;$('pinyin').textContent='Пиньинь: '+(py?'вкл.':'выкл.');if(mode<2)render()};$('translation').onclick=()=>{ru=!ru;$('translation').textContent='Перевод: '+(ru?'вкл.':'выкл.');if(mode<2)render()};$('slow').onclick=()=>{rate=rate===0.9?0.65:0.9;$('slow').textContent='Скорость: '+(rate===0.9?'обычная':'медленная')};start(0);
</script></html>
