<head>
<meta charset="utf-8">

<title>CSCA 物理中文 · Алиса</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--accent:#3157d5;--good:#16794b;--bad:#b42318;--line:#e5e7eb}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:980px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#172554,#3157d5);color:white;padding:26px;border-radius:24px}
.hero h1{margin:0 0 8px;font-size:clamp(28px,6vw,48px)}.hero p{margin:5px 0;opacity:.9}
.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0}.tabs button,.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer}
.tabs button{background:#e8ecf8;white-space:nowrap}.tabs button.on,.btn{background:var(--accent);color:white}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0}
.cn{font-size:clamp(23px,5vw,34px);font-weight:800;line-height:1.5}.py{color:#3157d5;margin-top:5px}.ru{color:var(--muted);margin-top:5px}
.opts{display:grid;gap:10px;margin-top:16px}.opt{background:white;border:2px solid var(--line);border-radius:15px;padding:14px;text-align:left;font-size:16px;cursor:pointer}
.opt:hover{border-color:#9aa9e8}.opt.good{border-color:var(--good);background:#ecfdf3}.opt.bad{border-color:var(--bad);background:#fff1f0}
.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#f8fafc;display:none}.feedback.show{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{padding:6px 10px;background:#eef2ff;border-radius:999px;font-size:13px}
.progress{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#3157d5;width:0}
.termgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.term{border:1px solid var(--line);border-radius:15px;padding:13px}.term b{font-size:20px}
.hidden{display:none}.toggle{background:#eef2ff;color:#263f9c}.exam .py,.exam .ru,.exam .hintbtn{display:none}
@media(max-width:520px){.wrap{padding:10px}.hero,.card{border-radius:17px}.card{padding:15px}}
</style></head><body><div class="wrap">
<section class="hero"><h1>CSCA 物理中文</h1><p>Тренажёр китайского языка физики для Алисы</p><p>目标：看到中文题目 → 立刻知道“给了什么？求什么？用什么规律？”</p></section>
<nav class="tabs"><button class="on" data-mode="learn">① Термины</button><button data-mode="decode">② Декодер</button><button data-mode="traps">③ Ловушки</button><button data-mode="exam">④ Мини-CSCA</button></nav>
<div class="row"><span class="pill" id="topic">力学 · механика</span><span class="pill" id="counter">1 / 1</span><button class="btn toggle" id="pybtn">拼音 Pinyin</button></div><div class="progress"><i id="bar"></i></div>
<section id="learn" class="mode"><div class="card"><h2>Сначала — язык условия</h2><p>Не решаем физику. Учимся мгновенно узнавать ключевые слова.</p><div class="termgrid" id="terms"></div></div><div class="card" id="learnq"></div></section>
<section id="decode" class="mode hidden"><div class="card" id="decodeq"></div></section><section id="traps" class="mode hidden"><div class="card" id="trapq"></div></section><section id="exam" class="mode hidden exam"><div class="card"><div class="row"><span class="pill">Только 中文</span><span class="pill">⏱ <b id="timer">75</b> сек.</span><span class="pill">得分 <b id="score">0</b></span></div><div id="examq"></div></div></section></div>
<script>
const terms=[["位移","wèiyí","перемещение"],["路程","lùchéng","путь"],["速度","sùdù","скорость"],["速率","sùlǜ","модуль скорости / быстрота"],["加速度","jiāsùdù","ускорение"],["匀速直线运动","yúnsù zhíxiàn yùndòng","равномерное прямолинейное движение"],["自由落体","zìyóu luòtǐ","свободное падение"],["力","lì","сила"],["合力","hélì","равнодействующая"],["重力","zhònglì","сила тяжести"],["摩擦力","mócālì","сила трения"],["弹力","tánlì","сила упругости"],["质量","zhìliàng","масса"],["重量","zhòngliàng","вес"],["动量","dòngliàng","импульс"],["冲量","chōngliàng","импульс силы"],["功","gōng","работа"],["功率","gōnglǜ","мощность"],["动能","dòngnéng","кинетическая энергия"],["势能","shìnéng","потенциальная энергия"],["机械能","jīxiènéng","механическая энергия"],["守恒","shǒuhéng","сохранение"],["圆周运动","yuánzhōu yùndòng","движение по окружности"],["向心力","xiàngxīnlì","центростремительная сила"],["电荷","diànhè","электрический заряд"],["电场","diànchǎng","электрическое поле"],["电流","diànliú","электрический ток"],["电压","diànyā","напряжение"],["电阻","diànzǔ","сопротивление"],["磁场","cíchǎng","магнитное поле"],["磁通量","cítōngliàng","магнитный поток"],["电磁感应","diàncí gǎnyìng","электромагнитная индукция"],["温度","wēndù","температура"],["压强","yāqiáng","давление"],["理想气体","lǐxiǎng qìtǐ","идеальный газ"],["波长","bōcháng","длина волны"],["频率","pínlǜ","частота"],["折射","zhéshè","преломление"],["反射","fǎnshè","отражение"],["干涉","gānshè","интерференция"]];
const learnQs=[{t:"力学",q:"“合力”是什么意思？",p:"“hélì” shì shénme yìsi?",a:["масса","равнодействующая сила","ускорение","трение"],ok:1,e:"合力 = результирующая (равнодействующая) всех сил."},{t:"力学",q:"“物体静止在水平桌面上” — что сообщает условие?",p:"wùtǐ jìngzhǐ zài shuǐpíng zhuōmiàn shàng",a:["тело падает","тело покоится на горизонтальном столе","тело ускоряется","тело вращается"],ok:1,e:"静止 = покоиться; 水平 = горизонтальный; 桌面 = поверхность стола."},{t:"力学",q:"“伸长量” в задаче о пружине — это…",p:"shēnchángliàng",a:["жёсткость","масса","удлинение","сила"],ok:2,e:"伸长 = удлиняться, 量 = величина. 伸长量 — величина удлинения."},{t:"电学",q:"“电阻” — это…",p:"diànzǔ",a:["напряжение","сопротивление","ток","заряд"],ok:1,e:"电阻 R — электрическое сопротивление."},{t:"波与光",q:"“波长” — это…",p:"bōcháng",a:["частота","амплитуда","длина волны","скорость света"],ok:2,e:"波 = волна, 长 = длина → 波长 λ."}];
const decodeQs=[{t:"力学",q:"一物体从静止开始做匀加速直线运动，已知加速度为2 m/s²，5 s后速度为多少？",p:"yí wùtǐ cóng jìngzhǐ kāishǐ zuò yún jiāsù zhíxiàn yùndòng...",ask:"Что нужно найти?",a:["ускорение","скорость через 5 с","массу","путь за первую секунду"],ok:1,e:"Ключ: 5 s 后速度为多少 = «какова скорость через 5 секунд?»"},{t:"力学",q:"质量为2 kg的物体受到10 N的水平合力，求物体的加速度。",p:"zhìliàng wéi... shòudào... shuǐpíng hélì, qiú...",ask:"Что дано и что требуется?",a:["m=2 kg, F=10 N; найти a","a=2; найти F","F=2; найти m","найти работу"],ok:0,e:"质量 = масса; 合力 = результирующая сила; 求…加速度 = найти ускорение."},{t:"电学",q:"两个电阻并联接入电路，求等效电阻。",p:"liǎng ge diànzǔ bìnglián jiērù diànlù, qiú děngxiào diànzǔ",ask:"Какой тип соединения?",a:["последовательное","параллельное","короткое замыкание","не сказано"],ok:1,e:"并联 = параллельное соединение. 串联 = последовательное."},{t:"热学",q:"一定质量的理想气体在体积不变的情况下升高温度，压强如何变化？",p:"yídìng zhìliàng de lǐxiǎng qìtǐ zài tǐjī bùbiàn...",ask:"Какое ограничение важно?",a:["масса меняется","объём постоянен","давление постоянно","температура постоянна"],ok:1,e:"体积不变 = объём не изменяется. 升高温度 = повысить температуру."},{t:"波与光",q:"一列波的频率为200 Hz，传播速度为340 m/s，求波长。",p:"yí liè bō de pínlǜ wéi... chuánbō sùdù... qiú bōcháng",ask:"Что требуется?",a:["частота","скорость распространения","длина волны","период"],ok:2,e:"求波长 = найти длину волны."}];
const trapQs=[{t:"力学",q:"位移 ≠ 路程. Какое соответствие верно?",p:"wèiyí / lùchéng",a:["位移=путь; 路程=перемещение","位移=перемещение; 路程=путь","оба означают скорость","оба означают расстояние без различий"],ok:1,e:"位移 — векторное перемещение; 路程 — пройденный путь."},{t:"力学",q:"质量 и 重量 — это одно и то же?",p:"zhìliàng / zhòngliàng",a:["да","нет: масса и вес/сила тяжести — разные величины","重量 = плотность","质量 = объём"],ok:1,e:"На экзамене их нельзя смешивать: 质量 — масса, 重量 — вес."},{t:"运动",q:"速度 и 速率: где важна направленность?",p:"sùdù / sùlǜ",a:["速度","速率","нигде","в обоих только число"],ok:0,e:"В учебной физической терминологии 速度 — velocity (вектор), 速率 — speed (скаляр)."},{t:"题目语言",q:"“至少” означает…",p:"zhìshǎo",a:["не более","ровно","по крайней мере / не меньше","приблизительно"],ok:2,e:"至少 = минимум, не меньше. 至多 = максимум, не больше."},{t:"题目语言",q:"“下列说法正确的是” — что делать?",p:"xiàliè shuōfǎ zhèngquè de shì",a:["найти неверное","выбрать верное утверждение","решить уравнение","нарисовать график"],ok:1,e:"下列 = следующие; 说法 = утверждения; 正确 = правильный."}];
const examQs=[{t:"力学",q:"一根弹簧的弹性系数为100 N/m，伸长0.10 m，需要的拉力为多少？",a:["1 N","10 N","100 N","1000 N"],ok:1,e:"胡克定律 F=kx → 100×0.10=10 N."},{t:"力学",q:"质量为4 kg的物体受到大小为12 N的合力，其加速度大小为多少？",a:["2 m/s²","3 m/s²","4 m/s²","48 m/s²"],ok:1,e:"a=F/m=12/4=3 m/s²."},{t:"波",q:"一列波的传播速度为300 m/s，频率为150 Hz，则波长为多少？",a:["0.5 m","2 m","45 m","450 m"],ok:1,e:"λ=v/f=300/150=2 m."},{t:"电学",q:"电压为12 V，电阻为6 Ω，通过电阻的电流为多少？",a:["0.5 A","2 A","6 A","72 A"],ok:1,e:"I=U/R=12/6=2 A."},{t:"热学",q:"一定质量的理想气体体积保持不变，绝对温度升高时，压强将如何变化？",a:["减小","增大","保持不变","一定变为零"],ok:1,e:"定容时 p/T 为常量，因此 T 增大，p 增大."},{t:"光学",q:"光从空气斜射入玻璃时，通常折射角与入射角相比如何？",a:["折射角较小","折射角较大","一定相等","没有折射"],ok:0,e:"从光疏介质进入光密介质，折射光线偏向法线."}];
let showPy=true,mode="learn",idx={learn:0,decode:0,traps:0,exam:0},score=0,seconds=75,tick=null;const $=s=>document.querySelector(s);function optionHTML(q){return `<div class="cn">${q.q}</div>${q.p?`<div class="py">${q.p}</div>`:""}${q.ask?`<h3>${q.ask}</h3>`:""}<div class="opts">${q.a.map((x,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join("")}</div><div class="feedback"></div><div class="row" style="margin-top:14px"><button class="btn hintbtn">Подсказка / разбор</button><button class="btn next">Дальше →</button></div>`}function data(k){return k==="learn"?learnQs:k==="decode"?decodeQs:k==="traps"?trapQs:examQs}function bind(box,q,key){box.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{box.querySelectorAll(".opt").forEach(x=>x.disabled=true);const i=+b.dataset.i;b.classList.add(i===q.ok?"good":"bad");box.querySelectorAll(".opt")[q.ok].classList.add("good");const f=box.querySelector(".feedback");f.innerHTML=(i===q.ok?"✓ Верно. ":"✗ Смотри ключевые слова. ")+q.e;f.classList.add("show");if(key==="exam"&&i===q.ok){score++;$("#score").textContent=score}}));const h=box.querySelector(".hintbtn");if(h)h.addEventListener("click",()=>{let f=box.querySelector(".feedback");f.textContent=q.e;f.classList.add("show")});box.querySelector(".next").addEventListener("click",()=>{idx[key]=(idx[key]+1)%data(key).length;render(key)})}function render(k){const arr=data(k),q=arr[idx[k]],box=k==="learn"?$("#learnq"):k==="decode"?$("#decodeq"):k==="traps"?$("#trapq"):$("#examq");box.innerHTML=optionHTML(q);bind(box,q,k);$("#topic").textContent=q.t;$("#counter").textContent=`${idx[k]+1} / ${arr.length}`;$("#bar").style.width=((idx[k]+1)/arr.length*100)+"%";document.querySelectorAll(".py").forEach(x=>x.style.display=showPy&&k!=="exam"?"block":"none");if(k==="exam")restartTimer()}function restartTimer(){clearInterval(tick);seconds=75;$("#timer").textContent=seconds;tick=setInterval(()=>{seconds--;$("#timer").textContent=seconds;if(seconds<=0){clearInterval(tick);idx.exam=(idx.exam+1)%examQs.length;render("exam")}},1000)}$("#terms").innerHTML=terms.map(x=>`<div class="term"><b>${x[0]}</b><div class="py">${x[1]}</div><div class="ru">${x[2]}</div></div>`).join("");document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{clearInterval(tick);mode=b.dataset.mode;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".mode").forEach(x=>x.classList.add("hidden"));$("#"+mode).classList.remove("hidden");render(mode)}));$("#pybtn").addEventListener("click",()=>{showPy=!showPy;$("#pybtn").textContent=showPy?"拼音 Pinyin ✓":"拼音 Pinyin";render(mode)});render("learn");
</script></body></html>
