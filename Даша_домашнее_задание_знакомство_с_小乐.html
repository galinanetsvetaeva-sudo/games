<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>认识小乐 · Домашнее задание для Даши</title>
<style>
:root{--ink:#24324a;--pink:#ff6f91;--yellow:#ffd166;--mint:#86e3ce;--blue:#6aa9ff;--paper:#fffdf7;--good:#168a62;--bad:#bd3d54}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:#fff4d8}body{margin:0;font-family:Inter,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff4d8,#ffe7ef 48%,#ddf8f1);min-height:100vh;min-height:100dvh;overflow-x:hidden}
.app{max-width:920px;margin:auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:18px}.top{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:#ffffffed;border:2px solid #fff;border-radius:22px;padding:12px 16px;box-shadow:0 10px 30px #64748b22;position:sticky;top:10px;z-index:3}.brand{font-weight:900}.track{height:12px;background:#e8edf5;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow));transition:.35s}.stars{white-space:nowrap;color:#f2a900;font-size:20px}.tool,.navbtn,.btn,.choice,.token{border:0;border-radius:15px;cursor:pointer;font-weight:800;color:var(--ink);transition:.18s;touch-action:manipulation}.tool{padding:9px 12px;background:#eef3ff}.stage{flex:1;display:grid;place-items:center;padding:22px 0}.card{width:100%;background:var(--paper);border:3px solid #fff;border-radius:30px;padding:clamp(22px,5vw,48px);box-shadow:0 18px 55px #52647a2d;animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}h1{font-size:clamp(38px,8vw,72px);margin:0 0 8px}h2{font-size:clamp(28px,5vw,44px);margin:0 0 14px}.lead{font-size:19px;line-height:1.55}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}.avatar{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(90px,18vw,160px);background:radial-gradient(circle at 35% 25%,#fff,var(--yellow));border:8px solid #fff;box-shadow:0 10px 25px #d8921833}.btn{background:linear-gradient(135deg,var(--pink),#ff9a72);color:white;padding:15px 22px;font-size:18px;box-shadow:0 8px 18px #ff6f9140;min-height:52px}.btn.alt{background:linear-gradient(135deg,var(--blue),#8275ef)}.btn:active,.choice:active,.token:active{transform:scale(.97)}.listen{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.mission{background:#edf7ff;border-left:6px solid var(--blue);padding:14px 18px;border-radius:14px;line-height:1.5}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.choice{padding:17px;background:white;border:2px solid #dbe5f2;font-size:18px;min-height:58px}.choice:hover{border-color:var(--blue);transform:translateY(-2px)}.choice.ok{background:#d9f7e9;border-color:var(--good)}.choice.no{background:#ffe0e5;border-color:var(--bad)}.feedback{min-height:30px;font-weight:800;font-size:18px;margin-top:14px}.story{font-size:clamp(22px,3.7vw,32px);line-height:1.75;background:white;padding:20px;border-radius:20px;border:2px dashed #f0c65d;overflow-wrap:anywhere}.py{display:none;font-size:.53em;color:#667085;font-weight:500;margin-left:5px}.showpy .py{display:inline}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.pair{padding:16px;border-radius:16px;background:#fff;border:2px solid #dce5ef}.pair select{font:inherit;padding:10px;border-radius:10px;border:2px solid #cad6e4;width:100%;margin-top:8px;min-height:48px;background:#fff}.tokens{display:flex;gap:10px;flex-wrap:wrap;padding:14px;background:#f0f5fb;border-radius:18px;min-height:70px}.answer{margin-top:14px;min-height:78px;background:white;border:3px dashed var(--mint);border-radius:18px;padding:14px;display:flex;gap:10px;flex-wrap:wrap}.token{padding:12px 16px;background:#fff;border:2px solid var(--blue);font-size:22px;min-height:50px}.nav{display:flex;justify-content:space-between;gap:16px}.navbtn{padding:12px 18px;background:#ffffffe8;min-height:48px}.navbtn:disabled{opacity:.35;cursor:default}.done{text-align:center}.medal{font-size:100px}.small{font-size:14px;color:#677489}
@media(max-width:650px){
 body{background:linear-gradient(160deg,#fff4d8,#ffe7ef 55%,#ddf8f1)}
 .app{padding:8px 10px calc(82px + env(safe-area-inset-bottom));min-height:100dvh}
 .top{grid-template-columns:auto minmax(70px,1fr) auto;gap:8px;top:6px;border-radius:17px;padding:9px 10px}.brand{font-size:15px}.stars{display:none}.track{height:9px}.tool{min-height:42px;padding:7px 9px;font-size:12px;white-space:nowrap}
 .stage{display:block;padding:12px 0}.card{min-height:calc(100dvh - 158px);border-radius:23px;padding:22px 18px;box-shadow:0 10px 28px #52647a24;display:flex;flex-direction:column;justify-content:center}
 h1{font-size:46px;line-height:1.05}h2{font-size:29px;line-height:1.15}.lead{font-size:17px;line-height:1.48}.small{font-size:13px}.mission{padding:13px 14px;font-size:16px}
 .hero{grid-template-columns:1fr;text-align:center}.avatar{max-width:170px;margin:4px auto 0;font-size:104px;border-width:6px}.hero .btn{width:100%}
 .choices,.pairs{grid-template-columns:1fr;gap:10px;margin:15px 0}.choice{width:100%;font-size:19px;padding:14px 12px;min-height:56px}.choice:hover{transform:none;border-color:#dbe5f2}.choice.ok{border-color:var(--good)}.choice.no{border-color:var(--bad)}
 .listen{margin:14px 0}.listen .btn,.card>.btn{width:100%}.btn{font-size:17px;padding:13px 16px}.pairs{margin-top:14px}.pair{padding:12px}.pair select{font-size:18px}
 .story{font-size:21px;line-height:1.72;padding:15px 13px}.py{display:none;margin-left:3px;font-size:.58em}.showpy .py{display:block;margin:-3px 0 3px;line-height:1.25}
 .tokens,.answer{gap:8px;padding:11px}.token{font-size:20px;padding:10px 13px}.feedback{font-size:16px;margin-top:10px}.medal{font-size:82px}
 .nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:linear-gradient(0deg,#fff 72%,#ffffff00);gap:10px}.navbtn{flex:1;border:1px solid #e4eaf2;box-shadow:0 5px 14px #3341551c;font-size:16px}
}
@media(max-width:360px){.brand{display:none}.top{grid-template-columns:1fr auto}.card{padding:18px 14px}h2{font-size:26px}.story{font-size:19px}.choice{font-size:17px}}
@media(orientation:landscape) and (max-height:520px){.card{min-height:auto}.avatar{display:none}.app{padding-bottom:72px}.stage{padding:8px 0}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">认识小乐</div><div class="track"><div class="bar" id="bar"></div></div><div class="stars" id="stars">☆ ☆ ☆ ☆ ☆</div><button class="tool" id="pyBtn">拼音 выкл.</button></header>
  <main class="stage" id="stage"></main>
  <nav class="nav"><button class="navbtn" id="prev">← Назад</button><button class="navbtn" id="next">Дальше →</button></nav>
</div>
<script>
const S=(h,p)=>`${h}<span class="py">${p}</span>`;
const audio='大家好！我叫小乐。我今年十岁。我的生日是九月三日。我喜欢星期日。我家有三口人：爸爸、妈妈和我。我家有一只猫。它叫豆豆。我喜欢红色。妈妈喜欢蓝色。爸爸喜欢黑色。';
const full=`${S('大家好！','dàjiā hǎo')} ${S('我叫小乐。','wǒ jiào Xiǎolè')}<br>${S('我今年十岁。','wǒ jīnnián shí suì')} ${S('我的生日是九月三日。','wǒ de shēngrì shì jiǔyuè sānrì')}<br>${S('我喜欢星期日。','wǒ xǐhuan xīngqīrì')}<br>${S('我家有三口人：爸爸、妈妈和我。','wǒ jiā yǒu sān kǒu rén: bàba, māma hé wǒ')}<br>${S('我家有一只猫。','wǒ jiā yǒu yì zhī māo')} ${S('它叫豆豆。','tā jiào Dòudou')}<br>${S('我喜欢红色。','wǒ xǐhuan hóngsè')} ${S('妈妈喜欢蓝色。','māma xǐhuan lánsè')} ${S('爸爸喜欢黑色。','bàba xǐhuan hēisè')}`;
let page=0,score=0,py=false,earned=new Set();
function speak(t=audio){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.82;speechSynthesis.speak(u)}
function reward(id){if(!earned.has(id)){earned.add(id);score=Math.min(5,score+1);document.getElementById('stars').textContent='★ '.repeat(score)+'☆ '.repeat(5-score)}}
function q(title,prompt,options,right,id){return `<section class="card"><h2>${title}</h2><div class="mission">${prompt}</div><div class="choices">${shuffle(options).map(x=>`<button class="choice" onclick="pick(this,'${x}','${right}','${id}')">${x}</button>`).join('')}</div><div class="feedback" id="f${id}"></div></section>`}
function pick(b,v,right,id){const all=b.parentElement.querySelectorAll('.choice');all.forEach(x=>x.disabled=true);if(v===right){b.classList.add('ok');document.getElementById('f'+id).textContent='✓ Отлично!';reward(id)}else{b.classList.add('no');all.forEach(x=>{if(x.textContent===right)x.classList.add('ok')});document.getElementById('f'+id).textContent='Послушай рассказ ещё раз и запомни правильный ответ 😊'}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
const pages=[
()=>`<section class="card hero"><div><div class="small">Короткое домашнее задание · 8–10 минут</div><h1>认识小乐</h1><p class="lead">Сегодня у нас новый герой. Послушай его рассказ и собери секретное досье!</p><button class="btn" onclick="go(1)">Начать расследование →</button></div><div class="avatar">🧒🏻</div></section>`,
()=>`<section class="card"><h2>任务一 · Только слушаем</h2><div class="mission">Текст пока спрятан. Послушай рассказ 1–2 раза. Постарайся услышать имя, возраст, дату, семью и любимые цвета.</div><div class="listen"><button class="btn alt" onclick="speak()">🔊 Послушать рассказ</button></div><p class="lead">Готова? Нажимай «Дальше» — начинаем собирать досье 🔎</p></section>`,
()=>q('Кто наш новый герой?','Как его зовут?',['小雨','小乐','豆豆'],'小乐','name'),
()=>q('Сколько ему лет?','Выбери правильный возраст.',['九岁','十岁','十一岁'],'十岁','age'),
()=>q('Когда у него день рождения?','Найди дату, которую ты услышала.',['三月八日','九月三日','六月十日'],'九月三日','date'),
()=>q('Любимый день','Какой день недели любит 小乐?',['星期六','星期日','星期一'],'星期日','day'),
()=>`<section class="card"><h2>家庭侦探 · Семейный детектив</h2><div class="listen"><button class="btn alt" onclick="speak()">🔊 Послушать ещё раз</button></div><div class="mission">Отметь три правильных утверждения.</div><div class="choices" id="family">${shuffle([['他家有三口人。',1],['他家有四口人。',0],['他家有一只猫。',1],['小猫叫豆豆。',1],['他有一个弟弟。',0]]).map(([x,v])=>`<button class="choice" data-v="${v}" onclick="this.classList.toggle('ok')">${x}</button>`).join('')}</div><button class="btn" onclick="checkFamily()">Проверить</button><div class="feedback" id="ffamily"></div></section>`,
()=>`<section class="card"><h2>谁喜欢什么颜色？</h2><div class="mission">Кто какой цвет любит? Выбери подходящий ответ.</div><div class="pairs"><div class="pair">小乐<select data-right="红色"><option value="">Выбери</option><option>蓝色</option><option>黑色</option><option>红色</option></select></div><div class="pair">妈妈<select data-right="蓝色"><option value="">Выбери</option><option>红色</option><option>蓝色</option><option>黑色</option></select></div><div class="pair">爸爸<select data-right="黑色"><option value="">Выбери</option><option>黑色</option><option>红色</option><option>蓝色</option></select></div></div><br><button class="btn" onclick="checkPairs()">Проверить</button><div class="feedback" id="fpairs"></div></section>`,
()=>`<section class="card"><h2>Собери предложение</h2><div class="mission">Нажимай на слова по порядку.</div><div class="tokens" id="bank">${shuffle(['我家','有','三口人','。']).map(x=>`<button class="token" onclick="move(this)">${x}</button>`).join('')}</div><div class="answer" id="answer"></div><br><button class="btn alt" onclick="resetTokens()">Сбросить</button> <button class="btn" onclick="checkOrder()">Проверить</button><div class="feedback" id="forder"></div></section>`,
()=>`<section class="card"><h2>Теперь открой весь рассказ</h2><div class="story">${full}</div><div class="listen"><button class="btn alt" onclick="speak()">🔊 Послушать</button></div><p class="lead">Прочитай рассказ вслух один раз. Если иероглиф забылся, включи пиньинь наверху.</p></section>`,
()=>`<section class="card done"><div class="medal">🏅</div><h2>任务完成！</h2><p class="lead">Ты познакомилась с 小乐 и раскрыла всё его досье. 太棒了！</p><button class="btn" onclick="go(0)">Пройти ещё раз</button></section>`
];
function checkFamily(){const bs=[...document.querySelectorAll('#family .choice')];const ok=bs.every(b=>(b.classList.contains('ok')?1:0)===+b.dataset.v);bs.forEach(b=>{b.disabled=true;if(+b.dataset.v)b.classList.add('ok');else if(b.classList.contains('ok'))b.classList.add('no')});document.getElementById('ffamily').textContent=ok?'✓ Все три факта найдены!':'Посмотри на зелёные ответы и послушай рассказ ещё раз.';if(ok)reward('family')}
function checkPairs(){const ss=[...document.querySelectorAll('select[data-right]')],ok=ss.every(s=>s.value===s.dataset.right);document.getElementById('fpairs').textContent=ok?'✓ Цвета распределены правильно!':'Пока не всё совпало. Можно ещё раз послушать рассказ.';if(ok)reward('pairs')}
function move(b){document.getElementById('answer').appendChild(b)}function resetTokens(){const bank=document.getElementById('bank');[...document.querySelectorAll('#answer .token')].forEach(x=>bank.appendChild(x));document.getElementById('forder').textContent=''}
function checkOrder(){const s=[...document.querySelectorAll('#answer .token')].map(x=>x.textContent).join('');const ok=s==='我家有三口人。';document.getElementById('forder').textContent=ok?'✓ Предложение готово!':'Попробуй ещё раз: сначала «у меня дома», затем «есть».';if(ok)reward('order')}
function go(n){page=Math.max(0,Math.min(pages.length-1,n));render()}function render(){const st=document.getElementById('stage');st.className='stage'+(py?' showpy':'');st.innerHTML=pages[page]();document.getElementById('bar').style.width=(page/(pages.length-1)*100)+'%';document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===pages.length-1;window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);document.getElementById('pyBtn').onclick=()=>{py=!py;document.getElementById('pyBtn').textContent=py?'拼音 вкл.':'拼音 выкл.';render()};render();
</script>
</body>
</html>
