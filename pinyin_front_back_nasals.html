.app{max-width:920px;min-height:100vh;min-height:100dvh;margin:auto;padding:14px 16px 76px;display:flex;flex-direction:column}.top{position:sticky;top:8px;z-index:10;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid #ffffff55;border-radius:20px;background:#26174cdd;color:#fff;backdrop-filter:blur(12px);box-shadow:0 12px 30px #0004}.brand{font-weight:900;white-space:nowrap}.progress{height:10px;background:#ffffff25;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--pink));transition:.35s}.score{color:var(--gold);white-space:nowrap;font-weight:900}.iconbtn{border:1px solid #ffffff44;background:#ffffff18;color:#fff;border-radius:13px;min-height:42px;padding:8px 10px;font-weight:800;cursor:pointer;touch-action:manipulation}
.stage{flex:1;display:grid;place-items:center;padding:16px 0}.panel{width:100%;background:linear-gradient(145deg,#fff,#fff9ef);border:3px solid #ffffffcc;border-radius:30px;padding:clamp(22px,4vw,42px);box-shadow:0 24px 70px #0005, inset 0 1px #fff;animation:enter .35s ease}@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}h1{font-size:clamp(38px,8vw,66px);line-height:1.02;margin:0 0 12px}h2{font-size:clamp(27px,5vw,42px);margin:0 0 14px;line-height:1.12}.lead{font-size:19px;line-height:1.55}.eyebrow{color:var(--violet);font-weight:900;text-transform:uppercase;letter-spacing:.08em;font-size:13px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center}.orb{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 32% 25%,#fff,#d9cfff 40%,#7b5ce3 73%,#382372);border:8px solid #fff;box-shadow:0 14px 30px #5d40c855;color:white;font-size:clamp(55px,12vw,110px);font-weight:1000}.orb small{display:block;font-size:.18em;letter-spacing:.05em}

@media(max-width:650px){.app{padding:8px 9px calc(78px + env(safe-area-inset-bottom))}.top{top:5px;grid-template-columns:auto 1fr auto;padding:8px 9px;border-radius:16px}.brand{font-size:14px}.score{display:none}.iconbtn{font-size:12px;min-height:40px}.stage{display:block;padding:10px 0}.panel{min-height:calc(100dvh - 146px);padding:21px 16px;border-radius:23px;display:flex;flex-direction:column;justify-content:center}h1{font-size:44px}h2{font-size:28px}.lead{font-size:17px}.hero{grid-template-columns:1fr;text-align:center}.orb{max-width:155px;margin:auto;font-size:74px;border-width:6px}.hero .btn,.panel>.btn{width:100%}.lesson,.choices,.pairgrid{grid-template-columns:1fr}.mouth{padding:14px}.tongue{height:55px}.choice{font-size:18px;min-height:58px;padding:12px}.choice strong{font-size:27px}.soundrow{display:grid;grid-template-columns:1fr 1fr}.sound{font-size:18px;padding:11px}.listenbox{padding:14px}.listenbox .sound{width:100%;min-width:0}.navbtn{min-width:0;flex:1}.medal{font-size:74px}.resultnum{font-size:45px}}

let page=0,stars=0,earned=new Set(),round=0,quiz=[],quizDone=false,zhVoice=null,zhVoices=[];

const femaleVoice=/Xiaoxiao|Xiaoyi|Ting[- ]?Ting|Mei[- ]?Jia|Sin[- ]?Ji|Huihui|Yaoyao|\bfemale\b|\bwoman\b/i;
function loadChineseVoice(){
 const voices=speechSynthesis.getVoices();zhVoices=voices.filter(v=>/^zh/i.test(v.lang));
 const saved=localStorage.getItem('pinyinVoice');
 zhVoice=zhVoices.find(v=>v.name===saved)||zhVoices.find(v=>maleVoice.test(v.name))||zhVoices.find(v=>/^zh[-_]CN/i.test(v.lang)&&!femaleVoice.test(v.name))||zhVoices.find(v=>/^zh[-_]CN/i.test(v.lang))||zhVoices[0]||null;
 updateVoiceUI();
}
function updateVoiceUI(){const s=document.getElementById('voiceSelect');if(!s)return;s.innerHTML=zhVoices.length?zhVoices.map((v,i)=>`<option value="${i}" ${v===zhVoice?'selected':''}>${maleVoice.test(v.name)?'♂ ':''}${v.name} · ${v.lang}</option>`).join(''):'<option>Китайский голос браузера</option>';}
function chooseVoice(i){zhVoice=zhVoices[Number(i)]||zhVoice;if(zhVoice)localStorage.setItem('pinyinVoice',zhVoice.name)}
loadChineseVoice();if('onvoiceschanged' in speechSynthesis)speechSynthesis.onvoiceschanged=loadChineseVoice;
function utter(text){const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.68;u.pitch=.72;if(zhVoice)u.voice=zhVoice;return u}
function speak(text){speechSynthesis.cancel();loadChineseVoice();speechSynthesis.speak(utter(text+'。'+text))}
function checkVoice(){speechSynthesis.cancel();loadChineseVoice();speechSynthesis.speak(utter('蓝。狼。蓝。狼'))}
function earn(id){if(!earned.has(id)){earned.add(id);stars++;document.getElementById('score').textContent='★ '+stars}}
function allWords(){return pairs.flatMap(x=>[x.a,x.b])}

function demo(){return `<section class="panel"><div class="eyebrow">Разминка ушей</div><h2>Послушай пары</h2><p class="lead">Сравни окончания. Здесь нет иероглифов — мы тренируем только слух и пиньинь.</p><div class="pairgrid">${pairs.slice(0,4).map(x=>`<div class="paircard"><b>${x.a.p} — ${x.b.p}</b><div class="soundrow">${soundBtn(x.a,'🔊 '+x.a.p)}${soundBtn(x.b,'🔊 '+x.b.p)}</div></div>`).join('')}</div></section>`}
function startDirection(){quiz=shuffle(allWords()).slice(0,8);round=0;quizDone=false;return direction()}
function direction(){const w=quiz[round];return `<section class="panel"><div class="round">Миссия 1 · ${round+1} из ${quiz.length}</div><h2>Где закончился звук?</h2><div class="listenbox">${soundBtn(w,'🔊 Послушать слово')}<p>Пиньинь пока спрятан!</p></div><div class="choices"><button class="choice" onclick="answerDirection('n',this)"><strong>-n</strong><br>язык впереди</button><button class="choice" onclick="answerDirection('ng',this)"><strong>-ng</strong><br>язык сзади</button></div><div class="feedback" id="feedback"></div></section>`}
function answerDirection(v,b){if(quizDone)return;quizDone=true;const w=quiz[round],ok=v===w.f;b.classList.add(ok?'correct':'wrong');[...document.querySelectorAll('.choice')].forEach(x=>x.disabled=true);const f=document.getElementById('feedback');f.className='feedback '+(ok?'good':'bad');f.innerHTML=(ok?'Точно! ':'Почти! ') + `<b class="reveal-hanzi">${w.h}</b> · <b>${w.p}</b> — ${w.r}. Окончание <b>-${w.f}</b>.`;if(ok)earn('d'+round);setTimeout(()=>{if(round<quiz.length-1){round++;quizDone=false;render(direction())}else go(4)},1800)}
function startPair(){quiz=shuffle(pairs).slice(0,6);round=0;quizDone=false;return pairQuiz()}
function pairQuiz(){const p=quiz[round],w=Math.random()<.5?p.a:p.b;window.currentWord=w;return `<section class="panel"><div class="round">Миссия 2 · ${round+1} из ${quiz.length}</div><h2>Какой pinyin прозвучал?</h2><div class="listenbox">${soundBtn(w,'🔊 Послушать два раза')}</div><div class="choices">${shuffle([p.a,p.b]).map(x=>`<button class="choice" onclick="answerPair('${x.p}',this)"><strong>${x.p}</strong></button>`).join('')}</div><div class="feedback" id="feedback"></div></section>`}
function answerPair(v,b){if(quizDone)return;quizDone=true;const w=window.currentWord,ok=v===w.p;b.classList.add(ok?'correct':'wrong');[...document.querySelectorAll('.choice')].forEach(x=>{x.disabled=true;if(x.textContent.trim()===w.p)x.classList.add('correct')});const f=document.getElementById('feedback');f.className='feedback '+(ok?'good':'bad');f.innerHTML=(ok?'Услышала! ':'Вот где спряталась разница: ')+`<b class="reveal-hanzi">${w.h}</b> · <b>${w.p}</b> — ${w.r}.`;if(ok)earn('p'+round);setTimeout(()=>{if(round<quiz.length-1){round++;quizDone=false;render(pairQuiz())}else go(5)},1900)}
function oddGame(){const sets=[
 {ws:[pairs[0].a,pairs[2].a,pairs[5].a,pairs[6].b],odd:'líng'},
 {ws:[pairs[0].b,pairs[1].b,pairs[5].b,pairs[4].a],odd:'zhēn'},
 {ws:[pairs[5].a,pairs[6].a,pairs[7].a,pairs[7].b],odd:'qīng'}];
 return `<section class="panel"><div class="eyebrow">Миссия 3</div><h2>Лишний звуковой хвостик</h2><p class="lead">В этой миссии даже pinyin спрятан. Сначала слушай пронумерованные дорожки, затем выбери лишнюю.</p>${sets.map((s,i)=>`<div class="soundrow" data-odd="${s.odd}">${shuffle(s.ws).map((w,j)=>`<div class="wordpick"><button class="sound" onclick="speak('${w.h}')">🔊 Звук ${j+1}</button><button class="pickbtn" onclick="chooseOdd(this,'${w.p}',${i})">Выбрать</button></div>`).join('')}</div><div class="feedback" id="odd${i}"></div>`).join('')}</section>`}
function chooseOdd(b,pinyin,i){const row=b.closest('.soundrow');if(row.dataset.done)return;const ok=pinyin===row.dataset.odd,w=allWords().find(x=>x.p===pinyin);const f=document.getElementById('odd'+i);f.className='feedback '+(ok?'good':'bad');f.innerHTML=ok?`Верно! Лишнее слово: <b class="reveal-hanzi">${w.h}</b> · <b>${w.p}</b> — ${w.r}.`:'Не он. Послушай остальные и попробуй ещё раз.';if(ok){row.dataset.done=1;b.style.background='#bcebd9';earn('o'+i)}else b.style.background='#ffd5df'}
function finalStart(){quiz=shuffle(allWords()).slice(0,10);round=0;quizDone=false;return finalQuiz()}
function finalQuiz(){const w=quiz[round],mate=pairs.find(p=>p.a===w||p.b===w),opts=shuffle([w,w===mate.a?mate.b:mate.a,...shuffle(allWords().filter(x=>x!==w&&x!==mate.a&&x!==mate.b)).slice(0,2)]);window.currentWord=w;return `<section class="panel"><div class="round">Финальный радар · ${round+1} из ${quiz.length}</div><h2>Поймай точный pinyin</h2><div class="listenbox">${soundBtn(w,'🔊 Сигнал радара')}</div><div class="choices">${opts.map(x=>`<button class="choice" onclick="answerFinal('${x.p}',this)"><strong>${x.p}</strong></button>`).join('')}</div><div class="feedback" id="feedback"></div></section>`}
function answerFinal(v,b){if(quizDone)return;quizDone=true;const w=window.currentWord,ok=v===w.p;b.classList.add(ok?'correct':'wrong');[...document.querySelectorAll('.choice')].forEach(x=>{x.disabled=true;if(x.textContent.trim()===w.p)x.classList.add('correct')});const f=document.getElementById('feedback');f.className='feedback '+(ok?'good':'bad');f.innerHTML=(ok?'Есть контакт! ':'Послушай хвостик ещё раз: ')+`<b class="reveal-hanzi">${w.h}</b> · <b>${w.p}</b> — ${w.r}.`;if(ok)earn('f'+round);setTimeout(()=>{if(round<quiz.length-1){round++;quizDone=false;render(finalQuiz())}else go(7)},1850)}
function finish(){const max=27,pct=Math.round(stars/max*100);setTimeout(fireworks,250);return `<section class="panel result"><div class="medal">🏆</div><div class="eyebrow">Лаборатория пройдена</div><h2>Уши-фонетисты готовы!</h2><div class="resultnum">${stars} ★</div><p class="lead">Ты училась слышать разницу между <b>-n</b> и <b>-ng</b>. Ошибки здесь не страшны: самое полезное — переслушать пару и почувствовать, куда ушёл звук.</p><button class="btn" onclick="location.reload()">Пройти ещё раз</button></section>`}
const pages=[intro,explain,demo,startDirection,startPair,oddGame,finalStart,finish];
function render(html){document.getElementById('stage').innerHTML=html;updateVoiceUI();document.getElementById('bar').style.width=(page/(pages.length-1)*100)+'%';document.getElementById('prev').disabled=page===0||[3,4,6].includes(page);document.getElementById('next').disabled=page===pages.length-1||[3,4,6].includes(page);scrollTo({top:0,behavior:'smooth'})}
function go(n){page=Math.max(0,Math.min(pages.length-1,n));if(page===3)render(startDirection());else if(page===4)render(startPair());else if(page===6)render(finalStart());else render(pages[page]())}
document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);
document.getElementById('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();document.getElementById('fullBtn').textContent='× Выйти'}else{await document.exitFullscreen();document.getElementById('fullBtn').textContent='⛶ На весь экран'}}catch(e){}}
function fireworks(){const c=document.getElementById('confetti'),colors=['#ffd466','#58dcdf','#ff6fae','#8a6df0','#fff'];for(let i=0;i<70;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.background=colors[i%colors.length];x.style.animationDelay=Math.random()*.8+'s';x.style.transform=`rotate(${Math.random()*180}deg)`;c.appendChild(x)}setTimeout(()=>c.innerHTML='',3600)}
go(0);
</script>
