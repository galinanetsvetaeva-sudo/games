 if(stage===0){h=`<h2>🪐 Космический словарь</h2><p>Послушай слово, повтори и попробуй назвать картинку самостоятельно. Нажимай «Скрыть слово», чтобы проверить память.</p><div class="grid">`+words.map((w,i)=>`<div class="card"><img src="${imgs[w[3]]}" alt="${w[2]}"><div class="han" id="wh${i}">${w[0]}</div><div class="pin" data-pin id="wp${i}">${w[1]}</div><div class="ru" data-ru>${w[2]}</div><div class="tools" style="justify-content:center"><button class="small" onclick="speak(words[${i}][0])">🔊</button><button class="small" onclick="toggleWord(${i})">🙈 Скрыть</button></div></div>`).join('')+'</div>'+stepButtons()}
 if(stage===1){if(question===null)randQuestion();let opts=shuffle([question,...shuffle([...words.keys()].filter(x=>x!==question)).slice(0,3)]);h=`<h2>🎯 Космический радар</h2><p>Прослушай слово и выбери правильную картинку. Раунд ${round+1}/12.</p><div class="center">${btn('🔊 Слушать',`speak(words[${question}][0])`,'gold')}</div><div class="miniCards">`+opts.map(i=>`<button onclick="answerWord(${i},12)"><img src="${imgs[words[i][3]]}" alt="Вариант"></button>`).join('')+`</div><div class="feedback">${gameFeedback}</div>`+stepButtons()}
 if(stage===2){if(wordMissing<0){wordMemory=shuffle([...words.keys()]).slice(0,6);wordMissing=wordMemory[Math.floor(Math.random()*6)];wordMemoryReveal=false}h=`<h2>🧠 Что исчезло?</h2><p>Посмотри на шесть картинок, запомни их и нажми «Спрятать одну». Назови исчезнувшее слово по-китайски. Раунд ${round+1}/6.</p><div class="miniCards">`+wordMemory.map(i=>`<div class="card" style="width:145px"><img src="${imgs[i]}" style="${wordMemoryReveal&&i===wordMissing?'visibility:hidden':''}"></div>`).join('')+`</div><div class="center">${!wordMemoryReveal?btn('🙈 Спрятать одну','wordMemoryReveal=true;render()','gold'):btn('🔊 Проверить ответ',`speak(words[${wordMissing}][0])`,'green')}${wordMemoryReveal?btn('Показать и дальше →','nextMemory()','gold'):''}</div>`+stepButtons()}
 if(stage===3){if(question===null)randQuestion();let opts=shuffle([question,...shuffle([...words.keys()].filter(x=>x!==question)).slice(0,3)]);h=`<h2>🔗 Найди пару</h2><p>Прочитай китайское слово и найди его картинку. Раунд ${round+1}/12.</p><div class="question">${words[question][0]} ${btn('🔊',`speak(words[${question}][0])`)}</div><div class="miniCards">`+opts.map(i=>`<button onclick="answerWord(${i},12)"><img src="${imgs[i]}"></button>`).join('')+`</div><div class="feedback">${gameFeedback}</div>`+stepButtons()}
 if(stage>=4&&stage<=8){let inds=groups[stage],title=['','','','','🌍 Учим первые четыре строки','🌟 Учим следующие четыре строки','🔭 Соединяем восемь строк','🌅 Финальные две строки','🚀 Собираем весь стих'][stage];let n=readCount[stage]||0;h=`<h2>${title}</h2><p>${stage===4?'Сначала разберём строки 1–4.':stage===5?'Теперь учим строки 5–8, не забывая предыдущие.':stage===6?'Повторяем уже восемь строк подряд.':stage===7?'Последний сюжетный поворот: мама зовёт завтракать!':'Соединяем все десять строк.'} Сначала слушай, затем читай самостоятельно.</p><div class="coach">📚 Прочтений: <b>${n}/3</b>. ${btn('🔊 Слушать блок',`speak(${JSON.stringify(inds.map(i=>lines[i][0]).join('。'))})`)}${btn('✅ Прочитали',`readBlock(${stage})`,'green')}</div><div class="tools">${btn('👀 Полный текст','setLearnMode(0)','gold')}${btn('🙈 Скрыть по одному слову','setLearnMode(1)')}${btn('🙈🙈 По два слова','setLearnMode(2)')}${btn('🌌 Почти наизусть','setLearnMode(3)')}</div><p class="tiny">Скрытые слова и соответствующий пиньинь открываются одновременно при нажатии. Нажми «Новые пропуски», чтобы изменить расположение.</p><div class="tools">${btn('🎲 Новые пропуски','randomizeMasks()')}</div>${poemHTML(inds,maskLevel)}`+stepButtons()}
 if(stage===9){let level=Math.min(maskLevel,4);h=`<h2>🫥 Исчезающие слова: все 10 строк</h2><p>Уровень ${level}/4. Восстанови слова и пиньинь, нажимая на жёлтые пропуски. Можно тренироваться многократно.</p><div class="tools">${btn('🎲 Новые пропуски','randomizeMasks()')}${btn('Следующий уровень →','maskLevel=Math.min(4,maskLevel+1);revealed={};render()','gold')}${btn('↩ Упростить','maskLevel=Math.max(1,maskLevel-1);revealed={};render()')}</div>${poemHTML([...lines.keys()],level)}`+stepButtons()}
 if(stage===10){let i=round%10,ts=tokens[i],cut=Math.max(1,Math.floor(ts.length/2));h=`<h2>🎤 Продолжи строку</h2><p>Строка ${i+1}/10. Произнеси продолжение, затем открой подсказку.</p><div class="verse"><div class="wordline">${ts.slice(0,cut).map(x=>unit(x,false)).join('')}${ts.slice(cut).map((x,k)=>unit(x,true,'cont'+k)).join('')}</div>${btn('🔊',`speak(lines[${i}][0])`)}</div><div class="tools">${btn('👀 Открыть продолжение',`revealPrefix('cont')`,'green')}${btn('Следующая строка →','round++;add(2);if(round>=10)next();else render()','gold')}</div>`+stepButtons()}
 if(stage===11){let i=round%10;if(question===null)question=shuffle(tokens[i].map((x,k)=>({x,k})));h=`<h2>🧩 Собери строку</h2><p>Строка ${i+1}/10. Нажимай на слова в правильном порядке. Пиньинь на карточках можно отключить.</p><div class="verse"><div class="wordline">${selected.map(k=>unit(question[k].x,false)).join('')||'🚀 Выбирай карточки...'}</div></div><div class="options">${question.map((o,k)=>selected.includes(k)?'':`<button class="option" onclick="selectToken(${k})">${o.x[0]}<div class="pin" data-pin>${o.x[1]}</div></button>`).join('')}</div><div class="tools">${btn('↩ Сбросить','selected=[];render()')}${btn('✓ Проверить','checkTokens()','green')}</div><div class="feedback">${gameFeedback}</div>`+stepButtons()}
 if(stage===12){if(question===null)question=shuffle(lines.map((l,i)=>({l,i})));h=`<h2>🔀 Собери всё стихотворение</h2><p>Выбери строки в правильной последовательности. Собрано: ${selected.length}/10.</p><div class="poem">${selected.map(k=>`<div class="verse"><span class="han">${question[k].l[0]}</span></div>`).join('')}</div><div>${question.map((x,k)=>selected.includes(k)?'':`<button class="orderItem" onclick="pickLine(${k})">${x.l[0]}<div class="pin" data-pin>${x.l[1]}</div></button>`).join('')}</div><div class="feedback">${gameFeedback}</div>${btn('↩ Начать заново','selected=[];render()')}`+stepButtons()}
 if(stage===13){let moods=[['😄','Радостно','Представь, что ты впервые летишь в космос!'],['🤫','Шёпотом','Тихо расскажи секретную космическую мечту.'],['😲','С удивлением','Ты увидел настоящего инопланетянина!'],['🤖','Как робот','Чётко, размеренно, словно робот на корабле.'],['🎭','Как актёр','Передай голосом неожиданное появление мамы.']];let m=moods[emotion%moods.length];h=`<h2>🎭 Космический театр эмоций</h2><p>Произнеси весь стих или выбранные строки с разными эмоциями. Тренируем выразительность и память!</p><div class="question">${m[0]} ${m[1]}</div><p class="center">${m[2]}</p><div class="center">${btn('🎲 Другая эмоция','emotion++;render()','gold')}${btn('📖 Показать текст','showFinal=!showFinal;render()')}${btn('🔊 Послушать весь стих',`speak(lines.map(l=>l[0]).join('。'))`)}</div>${showFinal?poemHTML([...lines.keys()],0):'<p class="center">🚀 Попробуй рассказать по памяти!</p>'}`+stepButtons()}
 if(stage===14){h=`<h2>🏆 Финальная космическая миссия</h2><p>Расскажи весь стих по картинкам. Если забыл строку, нажми на картинку, чтобы услышать подсказку.</p><div class="grid">${[[0,'Мечта',0],[2,'Ракета',1],[3,'Луна',2],[5,'Вселенная',3],[6,'Звёзды',4],[7,'Друзья',5],[10,'Песня',6],[9,'Млечный Путь',7],[0,'Пробуждение',8],[11,'Завтрак',9]].map(([k,t,i])=>`<button class="card" onclick="speak(lines[${i}][0])"><img src="${imgs[k]}"><div>${i+1}. ${t} 🔊</div></button>`).join('')}</div><div class="center">${btn('📜 Показать стих целиком','showFinal=!showFinal;render()')}${btn('🎉 Миссия выполнена!','finish()','gold')}</div>${showFinal?poemHTML([...lines.keys()],0):''}<div class="feedback">${gameFeedback}</div>`}
 $('content').innerHTML=h;applyToggles();}
function unit(t,hidden,key){let cls=hidden?'unit mask':'unit';return `<span class="${cls}" ${hidden?`data-reveal="${key}" onclick="this.classList.toggle('open')"`:''}><span class="han">${t[0]}</span><span class="pin" data-pin>${t[1]}</span></span>`}
function poemHTML(inds,level){return `<div class="verseBlock">${inds.map(i=>{let ts=tokens[i],count=Math.min(level,ts.length),seed=(i*3+Math.floor((maskSeed||0)*11))%ts.length,order=[...ts.keys()].sort((a,b)=>((a*7+seed)%ts.length)-((b*7+seed)%ts.length)),masked=order.slice(0,count);return `<div class="verse"><div><div class="wordline">${ts.map((t,j)=>unit(t,masked.includes(j),`${i}-${j}`)).join('')}<span style="font-size:24px">${i===8?'：':i===9?'！':'，'}</span></div><div class="ru" data-ru>${lines[i][2]}</div></div><button class="small" onclick="speak(lines[${i}][0])">🔊</button></div>`}).join('')}</div>`}
let maskSeed=0;
function randomizeMasks(){maskSeed++;render()}
function setLearnMode(n){maskLevel=n;render()}
function readBlock(s){readCount[s]=(readCount[s]||0)+1;if(readCount[s]<=3)add(2);render()}
function toggleWord(i){let h=$('wh'+i),p=$('wp'+i);let hidden=h.dataset.hidden==='1';h.textContent=hidden?words[i][0]:'❔';p.textContent=hidden?words[i][1]:'···';h.dataset.hidden=hidden?'0':'1'}
function answerWord(i,max){if(i===question){add(3);round++;question=null;gameFeedback='';if(round>=max)next();else render()}else{gameFeedback='Попробуй ещё раз! ✨';render()}}
function nextMemory(){round++;wordMissing=-1;wordMemoryReveal=false;add(2);if(round>=6)next();else render()}
function revealPrefix(prefix){document.querySelectorAll('[data-reveal^="'+prefix+'"]').forEach(el=>el.classList.add('open'))}
function selectToken(k){selected.push(k);render()}
function checkTokens(){let actual=selected.map(k=>question[k].x[0]).join(''),expected=tokens[round%10].map(x=>x[0]).join('');if(actual===expected){add(4);round++;selected=[];question=null;gameFeedback='';if(round>=10)next();else render()}else{gameFeedback='Порядок пока неверный — попробуй ещё!';render()}}
function pickLine(k){if(question[k].i===selected.length){selected.push(k);add(4);gameFeedback='';if(selected.length===10)next();else render()}else{gameFeedback='Эта строка идёт позже. Попробуй другую!';render()}}
function finish(){if(!completed.has('final')){add(20);completed.add('final')}gameFeedback='🌟 Поздравляем! Космическая миссия выполнена!';render()}
function applyToggles(){document.querySelectorAll('[data-pin]').forEach(e=>e.style.display=$('pinyin').checked?'':'none');document.querySelectorAll('[data-ru]').forEach(e=>e.style.display=$('translation').checked?'':'none')}
$('pinyin').onchange=applyToggles;$('translation').onchange=applyToggles;setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);render();
</script></body></html>
